/* ===== LLMAdapter：协议差异全封装（Phase 0.2）=====
   AgentLoop 只处理统一的 {content, toolCalls} 事件，协议细节全在这：
   - OpenAI：tool 消息带 tool_call_id（宽松）
   - Anthropic：tool_result 必须紧跟 assistant 的 tool_use，相邻同 role 消息要合并（严格）
   循环是协议无关的，差异被推到边缘——新增 Provider 只改这里 */
const LLMAdapter={
  async chat(msgs,opts){
    opts=opts||{};const cfg=Store.data.aiConfig||{};
    if(cfg.provider==='anthropic')return this._anthropic(msgs,cfg,opts);
    return this._openai(msgs,cfg,opts);
  },
  /* 工具结果消息（协议相关，必须放这） */
  toolMsg(id,content){const cfg=Store.data.aiConfig||{};if(cfg.provider==='anthropic'){return{role:'user',content:[{type:'tool_result',tool_use_id:id,content:String(content)}]}}return{role:'tool',tool_call_id:id,content:String(content)}},
  async _openai(msgs,cfg,opts){
    const body={model:cfg.model||'gpt-4o-mini',messages:msgs,max_tokens:opts.maxTokens||1500};
    if(!opts.noTools){body.tools=Skills.openaiTools();body.tool_choice='auto'}
    const r=await fetch(cfg.apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(cfg.apiKey||'')},body:JSON.stringify(body),signal:opts.signal});
    if(!r.ok)throw new Error('API '+r.status+' '+(await r.text()).slice(0,80));
    const j=await r.json();const m=j.choices[0].message;
    const toolCalls=(m.tool_calls||[]).map(tc=>({id:tc.id,name:tc.function.name,argsJson:tc.function.arguments}));
    let content=m.content||'';
    if(j.choices&&j.choices[0]&&j.choices[0].finish_reason==='length')content+='\n\n⚠ 回复达到长度上限已截断（建议把需求拆小再问）。';
    return{content,toolCalls,rawAssistant:m};
  },
  async _anthropic(msgs,cfg,opts){
    const sys=(msgs.find(m=>m.role==='system')||{}).content||'';
    const conv=[];msgs.filter(m=>m.role!=='system').forEach(m=>{
      if(m.role==='tool'){conv.push({role:'user',content:[{type:'tool_result',tool_use_id:m.tool_call_id,content:String(m.content)}]})}
      else if(m.role==='assistant'&&m.tool_calls){const blocks=[];if(m.content)blocks.push({type:'text',text:m.content});m.tool_calls.forEach(tc=>{let input={};try{input=JSON.parse(tc.function.arguments||'{}')}catch(e){}blocks.push({type:'tool_use',id:tc.id,name:tc.function.name,input})});conv.push({role:'assistant',content:blocks})}
      else conv.push({role:m.role,content:[{type:'text',text:String(m.content)}]});
    });
    const merged=[];conv.forEach(m=>{const last=merged[merged.length-1];if(last&&last.role===m.role&&Array.isArray(last.content)&&Array.isArray(m.content))last.content=last.content.concat(m.content);else merged.push(m)});
    const url=(cfg.apiUrl&&cfg.apiUrl.indexOf('/messages')>=0)?cfg.apiUrl:'https://api.anthropic.com/v1/messages';
    const body={model:cfg.model||'claude-sonnet-4-20250514',system:sys,messages:merged,max_tokens:opts.maxTokens||1500};
    if(!opts.noTools)body.tools=Skills.anthropicTools();
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':cfg.apiKey||'','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body),signal:opts.signal});
    if(!r.ok)throw new Error('API '+r.status+' '+(await r.text()).slice(0,80));
    const j=await r.json();
    const blocks=j.content||[];let text=blocks.filter(b=>b.type==='text').map(b=>b.text).join('');
    const toolCalls=blocks.filter(b=>b.type==='tool_use').map(b=>({id:b.id,name:b.name,argsJson:JSON.stringify(b.input||{})}));
    if(j.stop_reason==='max_tokens')text+='\n\n⚠ 回复达到长度上限已截断（建议把需求拆小再问）。';
    const rawAssistant={role:'assistant',content:text,tool_calls:toolCalls.map(tc=>({id:tc.id,function:{name:tc.name,arguments:tc.argsJson}}))};
    return{content:text,toolCalls,rawAssistant};
  }
};

/* ===== ToolPipeline：before(权限) → execute → after(格式化)（Phase 0.2）
   P0 行为对齐 v0.6.1：readOnly 自动执行喂真实结果；写操作入计划卡待确认。
   钩子已留好——P1 挂权限分级、P3 挂外部 ToolPkg/MCP 时循环本体不用改。
   修复了一个隐性 bug：v0.6.1 中未注册工具会误入计划卡（tool&&tool.readOnly 为 false），
   现在未注册工具直接返回错误喂回模型。 */
const ToolPipeline={
  run(fn,args,ctx){
    ctx=ctx||{};
    const tool=Skills.allTools().find(x=>x.id===fn);
    if(!tool)return{ok:false,pending:false,error:'工具「'+fn+'」未注册'};
    /* before：权限检查（P0 只分读写；P1 挂三级权限） */
    if(!tool.readOnly)return{ok:true,pending:true,result:'已加入执行计划，等待用户确认'};
    /* execute */
    const r=Skills.dispatch(fn,args);
    /* after：统一返回结构 */
    return{ok:r.ok,pending:false,result:r.ok?r.result:r.error};
  }
};

/* ===== AgentLoop：健壮循环引擎（Phase 0.2）
   替代 v0.6.1 的 6 轮硬循环。三重终止保险：
   ① maxRounds（默认 10）② 重复调用指纹检测 ③ abort() 外部中断
   中断语义（DSH 合成结果思路的简化版）：
   - LLM 请求中 abort → AbortError 捕获，返回 aborted=true
   - 工具执行中 → 已入队的动作保留，未执行的不会幻觉"已执行" */
const AgentLoop={
  config:{maxRounds:10,repeatLimit:3},
  active:null,
  async run(text,opts){
    opts=opts||{};const cfg={...this.config,...(opts.config||{})};
    const ac=new AbortController();
    const st={actions:[],reply:'',aborted:false,round:0,lastCall:null,repeat:0,texts:[]};
    this.active={ac,st};
    /* 超时兜底：请求挂住时自动 abort（默认 90s），避免界面永远转圈 */
    const timer=setTimeout(()=>{try{ac.abort()}catch(e){}},opts.timeoutMs||90000);
    const sys=opts.sys||'你是「枢」，用户的生活规划 agent。今天是 '+U.today()+'。工作流程：1) 先调用 query_summary 了解用户现状；2) 根据需求调用多个工具完成跨模块拆解；3) 结束时用一两句中文总结计划。写操作会先经用户确认再执行，你只管返回工具调用。';
    const msgs=[{role:'system',content:sys},{role:'user',content:text}];
    try{
      for(;st.round<cfg.maxRounds;st.round++){
        if(st.aborted)break;
        const r=await LLMAdapter.chat(msgs,{signal:ac.signal,maxTokens:opts.maxTokens});
        if(r&&r.toolCalls&&r.toolCalls.length){
          /* 累积每轮文本：模型常「说一句→调工具→再说→再调」，中间文本不能丢 */
          if(r.content)st.texts.push(r.content);
          msgs.push(r.rawAssistant);
          for(const tc of r.toolCalls){
            /* 重复调用检测：连续 N 次相同 tool+args 指纹 → 强制终止（防模型死循环） */
            const fp=tc.name+'|'+String(tc.argsJson||'');
            if(st.lastCall===fp){st.repeat++}else{st.repeat=0;st.lastCall=fp}
            if(st.repeat>=cfg.repeatLimit){
              st.texts.push('检测到重复调用工具「'+tc.name+'」已自动停止。建议换个方式描述需求，或检查之前的执行结果。');
              st.aborted=true;break;
            }
            let args={};try{args=JSON.parse(tc.argsJson||'{}')}catch(e){}
            const res=ToolPipeline.run(tc.name,args);
            if(res.pending){st.actions.push({tool:tc.name,args});msgs.push(LLMAdapter.toolMsg(tc.id,res.result))}
            else{msgs.push(LLMAdapter.toolMsg(tc.id,String(res.ok?res.result:res.error)))}
          }
          if(st.aborted)break;
        }else{
          if(r&&r.content)st.texts.push(r.content);
          st.reply=(r&&r.content)||'';break;
        }
      }
      /* 兜底总结：模型调了工具但没给收尾文本时，用实际动作动态生成，绝不硬编码空泛文案 */
      let reply=st.texts.join('\n\n')||st.reply;
      if(!reply&&st.actions.length){
        const labels=st.actions.map(a=>M.chat&&M.chat.toolLabel?M.chat.toolLabel(a.tool):a.tool);
        reply='已为你规划 '+st.actions.length+' 项操作：'+labels.join('、')+'。请确认后执行。';
      }
      return{reply,actions:st.actions,aborted:st.aborted,rounds:st.round};
    }catch(e){
      if(e&&(e.name==='AbortError'||ac.signal.aborted)){st.aborted=true;const reply=st.texts.join('\n\n');return{reply:reply||'⏱ 请求超时或被中断，请重试。',actions:st.actions,aborted:true,rounds:st.round}}
      throw e;
    }finally{clearTimeout(timer);this.active=null}
  },
  abort(){const a=this.active;if(a){a.st.aborted=true;try{a.ac.abort()}catch(e){}}}
};

/* ===== Agent 编排层：意图路由 + 委托 AgentLoop（薄壳，Phase 0.2）
   简单意图走本地规则（0 token）；规划类意图走 AgentLoop（LLM function calling） */
const Agent={
  PLAN_RE:/减.{0,4}(重|斤|kg)|增(重|肌)|瘦身|减肥|计划|规划|拆解|帮我安排|目标|存钱|攒钱|攒下|养成.{0,8}习惯|提醒我|监督我|自律|坚持|估算|热量|写入|记录到|记到|添加到|更新到|同步到|帮我.{0,8}(?:算|估算|记录|记|写|整理|安排|规划|拆解|制定|生成|创建|设置)/,
  isPlanning(t){return this.PLAN_RE.test(t||'')},
  _VALID_INTENTS:['record_meal','record_water','record_exercise','record_stretch','record_sleep','record_weight','record_expense','record_schedule','record_todo','record_beauty','plan','chat','ask'],
  /* B：LLM 意图分类主通道 —— schema 约束 JSON 输出，分类失败/无 API 时调用方落回正则 */
  async understand(text){
    const cfg=Store.data.aiConfig||{};
    if(!cfg.apiKey)return{engine:'regex'};
    const sys='你是「枢」生活工作台的意图分类器。将用户的中文输入归为下列 intent 之一：\n'+
      '- record_meal：记录饮食（吃了什么，含"帮我估算热量"类需求）\n- record_water：饮水/饮品（水、咖啡、茶、果汁、牛奶，带量）\n'+
      '- record_exercise：运动（跑步/健身/瑜伽/骑行/游泳，含时长）\n- record_stretch：拉伸/按摩/冥想\n'+
      '- record_sleep：睡眠/熬夜/起床\n- record_weight：体重记录\n- record_expense：记账/支出/收入\n'+
      '- record_schedule：日程（会议/课程/截止/约会，带时间）\n- record_todo：待办/提醒/要做某事\n'+
      '- record_beauty：护肤/美容\n'+
      '- plan：需要多步骤规划拆解的任务（减重/增肌/存钱/习惯养成/帮我安排/制定计划/帮我建立…规划）\n'+
      '- chat：问候/闲聊/提问/无法归类的输入（如 test、嗯、你好、这是什么）\n\n'+
      '严格只输出一个 JSON 对象，不要任何其他文字。schema：\n'+
      '{"intent":"上述之一","items":[{"字段":"随 intent 而定的记录字段"}],"date":"YYYY-MM-DD","time":"HH:MM","note":"简短说明"}\n\n'+
      'items 字段约定：meal→{name,calories,mealType:breakfast|lunch|dinner|snack}；water→{amount(ml),note}；exercise→{name,duration(分钟),calories}；'+
      'stretch→{type,duration}；sleep→{hours,quality(1-5)}；weight→{weight(kg)}；expense→{type:expense|income,amount,category,note}；'+
      'schedule→{title,startTime,endTime,category}；todo→{title,priority:low|mid|high}；beauty→{type,duration}。\n'+
      'date 按输入推断（"昨天/明天"等），无则今天。plan 和 chat 的 items 输出空数组。';
    const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),25000);
    try{
      const r=await LLMAdapter.chat([{role:'system',content:sys},{role:'user',content:text}],{maxTokens:500,noTools:true,signal:ac.signal});
      const content=(r&&r.content)||'';
      const m=content.match(/\{[\s\S]*\}/);
      if(!m)return{engine:'regex',error:'no-json'};
      const j=JSON.parse(m[0]);
      let intent=String(j.intent||'chat').toLowerCase().trim().replace(/[\s-]+/g,'_');
      if(!this._VALID_INTENTS.includes(intent))intent='chat';
      return{engine:'llm',intent,items:Array.isArray(j.items)?j.items:[],date:j.date||U.today(),time:j.time||'',note:j.note||''};
    }catch(e){
      if((e&&e.name==='AbortError')||ac.signal.aborted)return{engine:'regex',error:'timeout'};
      return{engine:'regex',error:(e&&e.message)||'llm-error'};
    }finally{clearTimeout(timer)}
  },
  _refreshMods(){['dashboard','goals','todo','schedule','fitness','wellness','finance'].forEach(k=>{try{const el=document.getElementById('m-'+k);if(el&&M[k]&&typeof M[k].render==='function')M[k].render()}catch(e){}})},
  async plan(text,opts){
    opts=opts||{};const d=Store.data,hist=d.chatHistory||(d.chatHistory=[]);
    const lk='plan-'+Date.now();hist.push({role:'assistant',content:'🧠 正在规划（调用工具中）…',_lk:lk,ts:Date.now()});Store.save();M.chat._refreshChats();
    const sys='你是「枢」，用户的生活规划 agent。今天是 '+U.today()+'。工作流程：1) 先调用 query_summary 了解用户现状；2) 根据需求调用多个工具完成跨模块拆解（例：用户要减重15斤 → create_goal(weight) + add_weight(基线) + add_todo(若干具体待办) + add_schedule(每周重复运动提醒) 组合）；3) 结束时用一两句中文总结计划。写操作会先经用户确认再执行，你只管返回工具调用。重复提醒用 add_schedule 的 rrule/rruleDays 参数：每周一 → rrule:"weekly"+rruleDays:[1]，持续N周再传 count:N（如 count:10 = 每周一次共10周）。';
    try{
      const r=await AgentLoop.run(text,{sys,maxTokens:1500});
      const lm=hist.find(m=>m._lk===lk);if(lm)lm.role='system-skip';
      if(r.actions.length){
        hist.push({role:'plan',id:U.uid(),reply:r.reply,actions:r.actions,status:'pending',ts:Date.now()});
      }else if(r.aborted){
        hist.push({role:'assistant',content:r.reply||'⏱ 请求超时或被中断，请重试。',ts:Date.now()});
      }else{
        /* LLM 纯文本回复（无工具调用）= 对话消息，直接以 md 渲染展示 */
        hist.push({role:'assistant',content:r.reply||'已完成。',ts:Date.now()});
      }
      Store.save();M.chat._refreshChats();
    }catch(e){
      const lm=hist.find(m=>m._lk===lk);if(lm){lm.content='⚠ 规划失败：'+e.message+'（已回退本地规则识别）';delete lm._lk}
      Store.save();M.chat._refreshChats();
      M.chat.handleAgent(text,{...opts,skipPlan:true});
    }
  },
  async executePlan(id){
    const d=Store.data;const hist=d.chatHistory||[];const p=hist.find(m=>m.id===id&&m.role==='plan');if(!p||p.status!=='pending')return;
    let ok=0,fail=0;const results=[];
    for(const a of p.actions||[]){const r=Skills.dispatch(a.tool,a.args);if(r.ok){ok++;results.push('✅ '+M.chat.toolLabel(a.tool))}else{fail++;results.push('❌ '+M.chat.toolLabel(a.tool)+'：'+r.error)}}
    p.status='done';p.result={ok,fail,results};p.reply=p.reply||'';Store.save();
    this._refreshMods();M.chat._refreshChats();
    UI.toast(fail?('执行完成：'+ok+' 成功 / '+fail+' 失败'):'计划已全部执行（'+ok+' 项）',fail?'warn':'success');
  },
  dropPlan(id){const hist=Store.data.chatHistory||[];const p=hist.find(m=>m.id===id&&m.role==='plan');if(p){p.status='dropped';Store.save();M.chat._refreshChats();UI.toast('已取消该计划','info')}}
};

M.chat={
genContext(){const t=U.today(),d=Store.data;let c=`今日数据摘要（${t}）：\n`;const ex=d.transactions.filter(x=>x.date===t&&x.type==='expense');if(ex.length)c+=`- 支出：${U.money(ex.reduce((s,e)=>s+e.amount,0))}（${ex.length}笔）\n`;const ms=d.meals.filter(m=>m.date===t);if(ms.length)c+=`- 摄入：${ms.reduce((s,m)=>s+m.calories,0)}kcal\n`;const el=d.exerciseLog.filter(e=>e.date===t);if(el.length)c+=`- 运动：${el.length}项，消耗${el.reduce((s,e)=>s+(e.calories||0),0)}kcal\n`;const sl=d.sleep.find(s=>s.date===t);if(sl)c+=`- 睡眠：${sl.hours}h，质量${sl.quality}/5\n`;const td=d.todos.filter(x=>!x.done);if(td.length)c+=`- 待办：${td.length}项未完成\n`;return c||'暂无今日数据'},

/* 可记录的 intent 白名单（LLM 分类结果映射到 applyAgent 分支） */
_recTargets:{meal:1,water:1,exercise:1,stretch:1,sleep:1,weight:1,expense:1,schedule:1,todo:1,beauty:1},
/* 纯对话链路：LLM 闲聊回复（不带工具），md 渲染 */
async handleChat(text){
  const d=Store.data;const hist=d.chatHistory||(d.chatHistory=[]);
  const lk='chat-'+Date.now();
  hist.push({role:'assistant',content:'💬 正在思考…',_lk:lk,ts:Date.now()});Store.save();this._refreshChats();
  const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),30000);
  try{
    const sys='你是「枢」，俪宁的个人生活 agent。今天是 '+U.today()+'。用简体中文简洁自然地回复。可以用 markdown 排版但不要太长。如果用户输入像是想记录点什么但你没把握分类，直接问一句确认。';
    const r=await LLMAdapter.chat([{role:'system',content:sys},{role:'user',content:text}],{maxTokens:800,noTools:true,signal:ac.signal});
    const lm=hist.find(m=>m._lk===lk);if(lm)lm.role='system-skip';
    hist.push({role:'assistant',content:(r&&r.content)||'（空回复）',ts:Date.now()});
    Store.save();this._refreshChats();
  }catch(e){
    const lm=hist.find(m=>m._lk===lk);if(lm){lm.content='⚠ 对话失败：'+(e&&e.name==='AbortError'?'请求超时':((e&&e.message)||'未知错误'));delete lm._lk}
    Store.save();this._refreshChats();
  }
},
/* B：LLM 意图分类主通道；无 API / 分类失败 → 正则兜底 */
async handleAgent(text,opts){
  opts=opts||{};
  const cfg0=Store.data.aiConfig||{};
  if(!opts.skipPlan&&cfg0.apiKey&&Agent.isPlanning(text)){Agent.plan(text,opts);return}
  /* 配了 API → 优先 LLM 意图分类 */
  if(cfg0.apiKey&&!opts.forceRegex){
    const hist=Store.data.chatHistory||(Store.data.chatHistory=[]);
    const lk='und-'+Date.now();
    hist.push({role:'assistant',content:'🧠 正在识别…',_lk:lk,ts:Date.now()});Store.save();this._refreshChats();
    let u=null;
    try{u=await Agent.understand(text)}catch(e){u={engine:'regex'}}
    const tmp=hist.find(m=>m._lk===lk);if(tmp)tmp.role='system-skip';
    if(u&&u.engine==='llm'){
      const intent=u.intent;
      if(intent==='plan'){Store.save();Agent.plan(text,opts);return}
      if(intent==='chat'||intent==='ask'){Store.save();this.handleChat(text);return}
      const key=intent.indexOf('record_')===0?intent.slice(7):null;
      if(key&&this._recTargets[key]){
        const userIdx=opts.userMsgIdx!==undefined?opts.userMsgIdx:hist.length-1;
        const items=(u.items&&u.items.length)?u.items:[{}];
        const parsed={intent:key,items,date:u.date||U.today(),time:u.time||'',raw:text,tags:[],confidence:'high'};
        hist.push({role:'parsed',content:text,parsed,idx:userIdx+1,ts:Date.now()});
        Store.save();
        M.chat._refreshChats();
        return;
      }
    }
    /* 分类失败 / 非法 intent → 落回正则 */
  }
  const parsed=U.agentParse(text);
  if(!parsed){return}
  const d=Store.data;
  const hist=d.chatHistory||(d.chatHistory=[]);
  /* 找最近 user message 的 index + 1 作为新 parsed 的 idx */
  const userIdx=opts.userMsgIdx!==undefined?opts.userMsgIdx:hist.length-1;
  const ent={role:'parsed',content:text,parsed,idx:userIdx+1,ts:Date.now()};
  /* 缺置信度且配置 LLM → 异步二次识别 */
  if(parsed.confidence==='low' && d.aiConfig && d.aiConfig.apiKey){
    hist.push({role:'system-skip',content:'正在调大模型协助识别…'});
    try{
      const sys='你是「枢」agent 的意图识别器。从用户的中文短句中提取意图，严格返回 JSON schema：{intent:"meal|exercise|stretch|sleep|water|schedule|todo|ask",items:[{...}],date:"YYYY-MM-DD",time:"HH:MM"}。 items 数组里每个 item 按上述 schema。 只回 JSON，不要任何解释。';
      const r=await fetch(d.aiConfig.apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+d.aiConfig.apiKey},body:JSON.stringify({model:d.aiConfig.model,messages:[{role:'system',content:sys},{role:'user',content:text}],max_tokens:400})});
      if(r.ok){const j=await r.json();const t=j.choices[0].message.content.replace(/```json|```/g,'').trim();const llm=JSON.parse(t);
        parsed.items=llm.items||parsed.items;parsed.intent=llm.intent||parsed.intent;parsed.date=llm.date||parsed.date;parsed.time=llm.time||parsed.time;parsed.confidence='high';
        /* 去掉最末 system-skip */
        for(let i=hist.length-1;i>=0;i--){if(hist[i].role==='system-skip'){hist.splice(i,1);break}}
      }
    }catch(e){/* 失败 fallback to 规则 */}
  }
  hist.push(ent);
  Store.save();
  /* 更新 m-chat 视图 */
  M.chat._refreshChats();
  if(parsed.confidence==='low'){/* 低置信度弹 modal 引导用户修正 */
    this._modalLowConfidence(parsed);
  }
},

_modalLowConfidence(p){

},

toolLabel(fn){const map={'life__create_goal':'🎯 创建目标','life__add_weight':'⚖️ 记录体重','life__add_meal':'🍱 记录饮食','life__add_exercise':'🏃 记录运动','life__add_water':'💧 记录饮水','life__add_sleep':'💤 记录睡眠','life__add_stretch':'🧘 拉伸/按摩','life__add_beauty':'✨ 护肤','life__add_meditation':'🌿 冥想','life__add_todo':'✓ 创建待办','life__add_schedule':'📅 创建日程','life__add_transaction':'💰 记账'};return map[fn]||fn},
_planCard(m){

  return `<div class="chat-msg bot"><b>🧠 执行计划（${(m.actions||[]).length} 项操作）</b><div style="margin-top:4px">${acts}</div>${m.reply?`<div style="margin-top:6px;font-size:.8rem;color:var(--text-2);line-height:1.6">${U.md(m.reply)}</div>`:''}<div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-primary btn-sm" onclick="Agent.executePlan('${m.id}')">确认执行</button><button class="btn btn-ghost btn-sm" onclick="Agent.dropPlan('${m.id}')">取消</button></div></div>`;
},

applyAgent(idx){const d=Store.data;const hist=d.chatHistory;const msg=hist.find(m=>m.idx===+idx&&m.role==='parsed');if(!msg)return;
  const p=msg.parsed;
  /* 主路由（primary intent 引导到对应模块） */
  const targetModules={meal:'fitness',exercise:'fitness',stretch:'wellness',sleep:'wellness',water:'wellness',weight:'fitness',expense:'finance',beauty:'wellness',schedule:'schedule',todo:'todo'};
  let count=0;
  /* 跨意图二次同步：如 water 带 beverage 标记（来自"喝养生茶"），已自动加 meal snack item */
  p.items.forEach(it=>{

    else if(intent==='sleep'){const i=d.sleep.findIndex(x=>x.date===p.date);if(i>=0)d.sleep[i]={...d.sleep[i],...it,date:p.date,bedtime:d.sleep[i].bedtime||'23:30',wakeTime:d.sleep[i].wakeTime||'07:00'};else d.sleep.push({id:U.uid(),hours:it.hours,quality:it.quality||3,bedtime:'23:30',wakeTime:'07:00',date:p.date});count++}
    else if(intent==='water'){d.water.push({id:U.uid(),amount:it.amount||250,date:p.date,note:it.note||''});count++}
    else if(intent==='weight'){d.weights.push({id:U.uid(),weight:+it.weight,date:p.date});count++}
    else if(intent==='expense'){d.transactions.push({id:U.uid(),type:it.type==='income'?'income':'expense',amount:+it.amount,category:it.category||'其他',note:it.note||'',date:p.date});count++}
    else if(intent==='beauty'){d.beauty.push({id:U.uid(),type:it.type||'护肤',duration:it.duration||10,date:p.date});count++}
    else if(intent==='schedule'){d.schedule.push({id:U.uid(),title:it.title,date:p.date,startTime:it.startTime||'09:00',endTime:it.endTime||'',category:it.category||'life',note:it.note||''});count++}
    else if(intent==='todo'){d.todos.push({id:U.uid(),title:it.title,priority:it.priority||'mid',done:false,dueDate:p.date,category:it.category||''});count++}
  });
  /* 写入 applied 标记，方便后续观察 */
  hist.push({role:'applied',count,target:targetModules[p.intent]||p.intent,date:p.date,ts:Date.now()});
  /* parsed 改成 system-skip 隐藏 */
  msg.role='system-skip';
  Store.save();
  UI.toast(`已写入 ${count} 条到「${({meal:'健身',exercise:'健身',stretch:'养生',sleep:'养生',water:'养生',weight:'健身',expense:'记账',beauty:'养生',schedule:'日程',todo:'待办'})[p.intent]||p.intent}」`,'success');
  if(UI.agent._renderMsgs)UI.agent._renderMsgs();
  const mc=document.getElementById('chat-msgs');if(mc){mc.innerHTML=this._renderChatMsgs();mc.scrollTop=mc.scrollHeight}
  /* 渲染目标模块（如果当前在 sheet 覆盖，刷新对应模块缓存数据即可） */
  const target=targetModules[p.intent];if(target){UI.nav(target)}
},

editPending(idx){const d=Store.data;const hist=d.chatHistory;const msg=hist.find(m=>m.idx===+idx&&m.role==='parsed');if(!msg)return;
  const p=msg.parsed;
  /* 在 modal 里编辑所有 items（简单版：转成 JSON 文本编辑） */
  const txt=JSON.stringify(p.items,null,2);
  UI.modal(`<div class="modal-head"><div class="modal-title">编辑识别结果（JSON）</div><button class="modal-close" onclick="UI.closeModal()">${I.close}</button></div><textarea id="ed-json" style="width:100%;min-height:300px;font-size:.78rem;font-family:monospace">${U.esc(txt)}</textarea><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary" style="flex:1" onclick="M.chat.saveEdit('${idx}')">保存</button><button class="btn btn-ghost" style="flex:1" onclick="UI.closeModal()">取消</button></div>`);
},
saveEdit(idx){const d=Store.data;const hist=d.chatHistory;const msg=hist.find(m=>m.idx===+idx&&m.role==='parsed');if(!msg)return;
  try{
    const items=JSON.parse(document.getElementById('ed-json').value);
    msg.parsed.items=items;msg.parsed.intent=items[0]?.intent||msg.parsed.intent;
    Store.save();
    if(UI.agent._renderMsgs)UI.agent._renderMsgs();
    const mc=document.getElementById('chat-msgs');if(mc){mc.innerHTML=this._renderChatMsgs();mc.scrollTop=mc.scrollHeight}
    UI.closeModal();UI.toast('已保存','success');
  }catch(e){UI.toast('JSON 解析失败：'+e.message,'error')}
},

dropPending(idx){const hist=Store.data.chatHistory;const i=hist.findIndex(m=>m.idx===+idx&&m.role==='parsed');if(i<0)return;hist[i].role='system-skip';Store.save();if(UI.agent._renderMsgs)UI.agent._renderMsgs();const mc=document.getElementById('chat-msgs');if(mc){mc.innerHTML=this._renderChatMsgs();mc.scrollTop=mc.scrollHeight}UI.toast('已取消','info')},

_renderChatMsgs(){const d=Store.data;const msgs=d.chatHistory||[];let html='';if(!msgs.length)html='<div class="empty" style="padding:40px 16px"><div style="font-size:.9rem">聊天记录将在这里展示</div></div>';
  msgs.forEach(m=>{
    if(m.role==='system-skip')return;
    if(m.role==='plan'){html+=this._planCard(m);return}
    if(m.role==='user'){html+=`<div class="chat-msg user">${U.esc(m.content||'')}</div>`;return}
    if(m.role==='parsed'){
      const p=m.parsed||{};
      const labels={meal:'饮食记录',exercise:'运动记录',stretch:'拉伸/按摩',sleep:'睡眠',water:'饮水',weight:'体重',expense:'记账',beauty:'护肤',schedule:'日程',todo:'待办',note:'备注',multi:'多意图合并'};
      const items=(p.items||[]).map(it=>{
        const i=it.intent||p.intent;
        if(i==='meal')return`🍱 ${it.name||''} · ${it.calories||0}kcal`;
        if(i==='exercise')return`🏃 ${it.name||''} · ${it.duration||0}min · ${it.calories||0}kcal`;
        if(i==='stretch')return`🧘 ${it.type||'拉伸'} · ${it.duration||0}min`;
        if(i==='sleep')return`💤 ${it.hours||0}h`;
        if(i==='water')return`💧 ${it.amount||0}ml${it.note?(' · '+it.note):''}`;
        if(i==='weight')return`⚖️ ${it.weight||0}kg`;
        if(i==='expense')return`💰 ${it.type==='income'?'收入':'支出'} ${it.amount||0}${it.category?(' · '+it.category):''}`;
        if(i==='beauty')return`✨ ${it.type||'护肤'} · ${it.duration||0}min`;
        if(i==='schedule')return`📅 ${it.title||''} · ${it.startTime||''}`;
        if(i==='todo')return`✓ ${it.title||''}`;
        return'';
      }).join('<br>');
      html+=`<div class="chat-msg bot"><b>识别 → ${labels[p.intent]||'备注'}</b>（${p.date||''}${p.time?' · '+p.time:''}）<div style="margin-top:4px;font-size:.78rem">${items||'已记录'}</div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-primary btn-sm" onclick="M.chat.applyAgent('${m.idx}')">确认写入</button><button class="btn btn-ghost btn-sm" onclick="M.chat.editPending('${m.idx}')">编辑</button><button class="btn btn-ghost btn-sm" onclick="M.chat.dropPending('${m.idx}')">取消</button></div></div>`;
      return;
    }
    if(m.role==='applied'){html+=`<div class="chat-msg sys">✅ 已写入 ${m.count} 条到「${m.target}」 · ${U.fmtDF(m.date)}</div>`;return}
    if(m.role==='assistant'){html+=`<div class="chat-msg bot">${U.md(m.content)}</div>`;return}
  });
  return html;
},

render(){const d=Store.data;const cfg=d.aiConfig;const msgs=d.chatHistory||[];
  document.getElementById('m-chat').innerHTML=`<div class="page-header"><div><div class="page-title">AI 对话</div><div class="page-sub">${cfg.apiKey?('已配置 '+(cfg.provider==='anthropic'?'Claude':'OpenAI兼容')+' · LLM 意图识别：记录直达 · 规划走 Function Calling · 闲聊直接对话'):'未配置API — 本地规则识别（简单记录可用），配置后解锁 LLM 意图识别与规划'}</div></div><div style="display:flex;gap:6px"><button class="btn btn-ghost btn-sm" onclick="M.chat.showConfig()">设置</button></div></div>
${!cfg.apiKey?`<div class="chat-config"><div style="font-size:.85rem;color:var(--text-2);margin-bottom:8px">配置大模型 API 后，输入将走 LLM 意图识别：(1) 记录类直达确认卡 (2) 规划类自动拆解任务 (3) 闲聊直接对话。支持 OpenAI 兼容接口与 Anthropic。</div><button class="btn btn-primary btn-sm" onclick="M.chat.showConfig()">配置 API</button></div>`:''}
<div class="chat-wrap"><div class="chat-msgs" id="chat-msgs">${this._renderChatMsgs()}</div><div class="chat-input-row"><textarea id="chat-input" placeholder="输入消息，回车发送，Shift+回车换行…" rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();UI.agent.commit(this.value);this.value=''}"></textarea></div></div>`;
  const cm=document.getElementById('chat-msgs');if(cm)cm.scrollTop=cm.scrollHeight;
  /* 触发 agent-fab 显示更新 */
  if(UI.agent._renderMsgs)UI.agent._renderMsgs();
},

showConfig(){const cfg=Store.data.aiConfig;const sk=Skills.list().map(s=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:.78rem"><span>🔌 ${U.esc(s.name)}</span><span style="color:var(--text-3)">${s.tools.length} 个工具</span></div>`).join('');UI.modal(`<div class="modal-head"><div class="modal-title">API 配置</div><button class="modal-close" onclick="UI.closeModal()">${I.close}</button></div><div class="form-group"><label class="form-label">接口类型</label><select id="ac-prov" onchange="M.chat._provHint()"><option value="openai" ${cfg.provider!=='anthropic'?'selected':''}>OpenAI 兼容（OpenAI / DeepSeek / OpenRouter / Gemini 兼容口）</option><option value="anthropic" ${cfg.provider==='anthropic'?'selected':''}>Anthropic（Claude）</option></select></div><div class="form-group"><label class="form-label">API 地址</label><input type="text" id="ac-url" value="${U.esc(cfg.apiUrl||'')}" placeholder="https://api.openai.com/v1/chat/completions"></div><div class="form-group"><label class="form-label">API Key</label><input type="password" id="ac-key" value="${U.esc(cfg.apiKey||'')}" placeholder="sk-..."></div><div class="form-group"><label class="form-label">模型</label><input type="text" id="ac-model" value="${U.esc(cfg.model||'gpt-4o-mini')}" placeholder="gpt-4o-mini"></div><div style="background:var(--surface-2);border-radius:var(--r-xs);padding:10px;margin-bottom:10px;font-size:.78rem;color:var(--text-3)">规划类消息走 Function Calling（工具 schema 不占对话上下文）；简单记录走本地规则 0 token。API Key 仅存储在本地浏览器。</div><div style="border:1px solid var(--border);border-radius:var(--r-xs);padding:10px;margin-bottom:14px"><div style="font-size:.75rem;color:var(--text-3);margin-bottom:4px">已注册技能（可插拔）</div>${sk}<div style="font-size:.72rem;color:var(--text-3);margin-top:6px">未来可挂载外部技能包（股票行情 / 邮件 / 远端 skill 下载）</div></div><button class="btn btn-primary" style="width:100%" onclick="M.chat.saveConfig()">保存配置</button>`)},
_provHint(){const p=document.getElementById('ac-prov').value;const u=document.getElementById('ac-url');const m=document.getElementById('ac-model');if(p==='anthropic'){if(!u.value||u.value.indexOf('openai')>=0)u.value='https://api.anthropic.com/v1/messages';m.placeholder='claude-sonnet-4-20250514';if(!m.value||m.value.indexOf('gpt')>=0)m.value='claude-sonnet-4-20250514'}else{if(!u.value||u.value.indexOf('anthropic')>=0)u.value='https://api.openai.com/v1/chat/completions';m.placeholder='gpt-4o-mini';if(m.value.indexOf('claude')>=0)m.value='gpt-4o-mini'}},

saveConfig(){const prov=document.getElementById('ac-prov').value;const url=document.getElementById('ac-url').value.trim()||(prov==='anthropic'?'https://api.anthropic.com/v1/messages':'https://api.openai.com/v1/chat/completions');Store.data.aiConfig={provider:prov,apiUrl:url,apiKey:document.getElementById('ac-key').value.trim(),model:document.getElementById('ac-model').value.trim()||(prov==='anthropic'?'claude-sonnet-4-20250514':'gpt-4o-mini')};Store.save();UI.closeModal();this.render();UI.toast('API配置已保存','success')},

async send(){const inp=document.getElementById('chat-input');if(!inp)return;const txt=inp.value.trim();if(!txt)return;
  if(!Store.data.aiConfig.apiKey){UI.toast('请先配置API','warn');this.showConfig();return}
  const d=Store.data;const hist=d.chatHistory;hist.push({role:'user',content:txt,ts:Date.now()});inp.value='';const cm=document.getElementById('chat-msgs');cm.innerHTML=this._renderChatMsgs();cm.scrollTop=cm.scrollHeight;if(UI.agent._renderMsgs)UI.agent._renderMsgs();
  const loadingKey='loading-'+Date.now();
  hist.push({role:'assistant',content:'思考中…',_lk:loadingKey,ts:Date.now()});
  Store.save();
  cm.innerHTML=this._renderChatMsgs();cm.scrollTop=cm.scrollHeight;
  try{
    const ctx=this.genContext();
    const sys='你是「枢」，用户的生活助手。基于用户今日实际数据，给出简短、有方向感的回答。';
    const msgs=[{role:'system',content:sys+' 今日数据：\n'+ctx},...hist.filter(m=>!m._lk)];
    const r=await fetch(d.aiConfig.apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+d.aiConfig.apiKey},body:JSON.stringify({model:d.aiConfig.model,messages:msgs,max_tokens:1000})});
    if(!r.ok)throw new Error('API返回 '+r.status);
    const data=await r.json();const reply=data.choices[0].message.content;
    /* 替换 loading */
    const found=hist.find(m=>m._lk===loadingKey);if(found){found.content=reply;delete found._lk}
    Store.save();
    cm.innerHTML=this._renderChatMsgs();cm.scrollTop=cm.scrollHeight;
    if(UI.agent._renderMsgs)UI.agent._renderMsgs();
  }catch(e){
    const found=hist.find(m=>m._lk===loadingKey);if(found){found.content='⚠ 请求失败：'+e.message;delete found._lk}
    Store.save();
    cm.innerHTML=this._renderChatMsgs();cm.scrollTop=cm.scrollHeight;
    UI.toast('API请求失败','error');
  }
}
};
M.settings={
render(){const d=Store.data,p=d.profile;const totalEntries=d.transactions.length+d.investments.length+d.weights.length+d.meals.length+d.exerciseLog.length+d.sleep.length+d.beauty.length+d.stretching.length+d.schedule.length+d.todos.length;
document.getElementById('m-settings').innerHTML=`<div class="page-header"><div><div class="page-title">设置</div><div class="page-sub">数据管理与个人设置</div></div></div>
<div class="card" style="margin-bottom:14px"><div class="card-title">个人资料</div><div class="form-row"><div class="form-group"><label class="form-label">昵称</label><input type="text" id="pf-name" value="${U.esc(p.name||'')}" onchange="M.settings.saveProfile()"></div><div class="form-group"><label class="form-label">身高(cm)</label><input type="number" id="pf-h" value="${p.height||''}" onchange="M.settings.saveProfile()"></div></div><div class="form-row"><div class="form-group"><label class="form-label">年龄</label><input type="number" id="pf-age" value="${p.age||''}" onchange="M.settings.saveProfile()"></div><div class="form-group"><label class="form-label">目标体重(kg)</label><input type="number" id="pf-tw" step="0.1" value="${p.targetWeight||''}" onchange="M.settings.saveProfile()"></div></div><div class="form-row"><div class="form-group"><label class="form-label">日热量目标</label><input type="number" id="pf-cal" value="${p.dailyCalorieTarget||''}" onchange="M.settings.saveProfile()"></div><div class="form-group"><label class="form-label">日预算(S$)</label><input type="number" id="pf-bd" step="0.01" value="${p.dailyBudget||''}" onchange="M.settings.saveProfile()"></div></div><div class="form-group"><label class="form-label">活动系数</label><select id="pf-act" onchange="M.settings.saveProfile()"><option value="1.2" ${p.activityLevel==1.2?'selected':''}>久坐(1.2)</option><option value="1.4" ${p.activityLevel==1.4?'selected':''}>轻度活动(1.4)</option><option value="1.55" ${p.activityLevel==1.55?'selected':''}>中度活动(1.55)</option><option value="1.725" ${p.activityLevel==1.725?'selected':''}>高度活动(1.725)</option></select></div><div class="form-row"><div class="form-group"><label class="form-label">目标体脂(%)</label><input type="number" id="pf-bf" step="0.1" value="${p.targetBodyFat||''}" onchange="M.settings.saveProfile()"></div><div class="form-group"><label class="form-label">日饮水目标(ml)</label><input type="number" id="pf-wt" value="${p.targetWater||''}" onchange="M.settings.saveProfile()"></div></div></div>
<div class="card" style="margin-bottom:14px"><div class="card-title">数据管理</div><div style="font-size:.8rem;color:var(--text-2);margin-bottom:12px">当前共 <strong>${totalEntries}</strong> 条记录 · 存储计数器：${Store.counter}</div><div class="grid grid-2"><button class="btn btn-ghost" onclick="Store.export()">${I.download} 导出备份</button><button class="btn btn-ghost" onclick="document.getElementById('file-import').click()">${I.upload} 导入数据</button></div><div style="height:10px"></div><div class="grid grid-2"><button class="btn btn-ghost" onclick="UI.confirm('重置为演示数据？当前数据将被覆盖。',()=>Store.reset())">重置演示数据</button><button class="btn btn-danger" onclick="UI.confirm('⚠️ 清空所有数据？此操作不可逆！确定要清空吗？',()=>Store.clearAll())">清空全部数据</button></div></div>
<div class="card" style="margin-bottom:14px"><div class="card-title">${I.cloud} 云端同步（实验）</div><div style="font-size:.8rem;color:var(--text-2);margin-bottom:12px">配置 Supabase 后可实现手机/电脑数据互通。Key 仅存在本地，不会进入代码库。</div><div class="form-group"><label class="form-label">Supabase URL</label><input type="text" id="cs-url" value="${U.esc(d.cloudSync.url||'')}" placeholder="https://xxxx.supabase.co" onchange="M.settings.saveCloud()"></div><div class="form-group"><label class="form-label">Anon Key</label><input type="password" id="cs-key" value="${U.esc(d.cloudSync.key||'')}" placeholder="eyJ..." onchange="M.settings.saveCloud()"></div><div style="display:flex;gap:10px"><button class="btn btn-primary" onclick="M.settings.saveCloud()">${I.sync} 保存并连接</button><button class="btn btn-ghost" onclick="M.settings.disconnectCloud()">断开</button></div><div id="cs-status" style="margin-top:10px;font-size:.78rem;color:var(--text-3)">${Adapters.Cloud.enabled()?'已启用':'未启用'}</div></div>
${Store.corruptedRaw?`<div class="card" style="margin-bottom:14px;border-color:var(--expense)"><div class="card-title" style="color:var(--expense)">⚠ 损坏数据恢复</div><p style="font-size:.82rem;color:var(--text-2);margin-bottom:10px">检测到之前的数据损坏。你可以导出原始数据进行手动恢复。</p><button class="btn btn-ghost btn-sm" onclick="M.settings.exportCorrupted()">导出损坏的原始数据</button></div>`:''}
<div class="card"><div class="card-title">关于</div><div style="font-size:.82rem;color:var(--text-2);line-height:1.8"><strong>枢 · 生活工作台</strong><br>单文件HTML应用，所有数据存储在本地浏览器<br>支持导出JSON备份 · 不依赖任何外部服务<br><br>数据存储键：${CFG.KEY}<br>备份提醒阈值：每 ${CFG.BACKUP_N} 条新记录</div></div>`},
saveProfile(){const p=Store.data.profile;p.name=document.getElementById('pf-name').value;p.height=parseFloat(document.getElementById('pf-h').value)||p.height;p.age=parseInt(document.getElementById('pf-age').value)||p.age;p.targetWeight=parseFloat(document.getElementById('pf-tw').value)||p.targetWeight;p.targetBodyFat=parseFloat(document.getElementById('pf-bf').value)||p.targetBodyFat;p.dailyCalorieTarget=parseInt(document.getElementById('pf-cal').value)||p.dailyCalorieTarget;p.dailyBudget=parseFloat(document.getElementById('pf-bd').value)||p.dailyBudget;p.activityLevel=parseFloat(document.getElementById('pf-act').value)||1.4;p.targetWater=parseInt(document.getElementById('pf-wt').value)||p.targetWater;Store.save();UI.toast('资料已保存','success')},
saveCloud(){Store.data.cloudSync={url:document.getElementById('cs-url').value.trim(),key:document.getElementById('cs-key').value.trim(),enabled:true};Adapters.Cloud.setConfig(Store.data.cloudSync);Store.save();this.render();UI.toast('云端配置已保存','success')},
disconnectCloud(){Store.data.cloudSync={url:'',key:'',enabled:false};Adapters.Cloud.setConfig(null);Store.save();this.render();UI.toast('已断开云端同步','info')},
exportCorrupted(){const b=new Blob([Store.corruptedRaw],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='corrupted-'+U.today()+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);UI.toast('已导出损坏数据','info')}
};
document.addEventListener('DOMContentLoaded',()=>{Store.init();UI.init();UI.nav('dashboard')});
</script>
