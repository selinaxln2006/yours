<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>枢 · PAA</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#101218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="枢">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<script>
/* 首帧前应用强调色，避免闪烁（仅外观偏好存 localStorage，数据不落浏览器） */
try { const a = localStorage.getItem('paaAccent'); if (a) document.documentElement.dataset.accent = a; } catch {}
</script>
<style>
/* ================================================================
   枢 · Console v2 设计系统 —— 精致暗色 + 磨砂玻璃
   强调色可切换（html[data-accent]）；旧变量名保留给面板渲染器的内联样式
   ================================================================ */
:root{
  --bg0:oklch(13.5% 0.008 265);
  --glass:oklch(21% 0.012 265 / .52);
  --glass2:oklch(25% 0.014 265 / .58);
  --glass-solid:oklch(19% 0.01 265 / .92);
  --blur:blur(22px) saturate(150%);
  --hl:inset 0 1px 0 oklch(100% 0 0 / .06);
  --shadow:0 12px 40px oklch(0% 0 0 / .32);
  --line:oklch(100% 0 0 / .075);
  --line2:oklch(100% 0 0 / .12);
  --line3:oklch(100% 0 0 / .2);
  --text0:oklch(96% 0.004 265);
  --text1:oklch(81% 0.01 265);
  --text2:oklch(63% 0.014 265);
  --text3:oklch(49% 0.014 265);
  --ok:oklch(77% 0.14 158);
  --warn:oklch(81% 0.12 78);
  --err:oklch(70% 0.17 25);
  --cool:oklch(76% 0.1 230);
  /* 兼容旧名 */
  --bg1:var(--glass); --bg2:oklch(100% 0 0 / .045); --bg3:oklch(100% 0 0 / .08);
  --r:10px; --r2:14px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --disp:var(--sans); --serif:var(--sans);
  /* 默认强调色：黄铜 */
  --acc:oklch(80% 0.11 78); --acc2:oklch(86% 0.09 82); --acc-ink:oklch(24% 0.05 70);
  --blob2:oklch(55% 0.12 30);
}
html[data-accent="indigo"]{--acc:oklch(70% 0.15 275);--acc2:oklch(80% 0.11 275);--acc-ink:oklch(98% 0.01 275);--blob2:oklch(55% 0.16 320)}
html[data-accent="teal"]{--acc:oklch(76% 0.12 185);--acc2:oklch(84% 0.09 185);--acc-ink:oklch(22% 0.05 190);--blob2:oklch(55% 0.13 240)}
html[data-accent="rose"]{--acc:oklch(74% 0.14 10);--acc2:oklch(83% 0.1 10);--acc-ink:oklch(22% 0.05 10);--blob2:oklch(55% 0.14 300)}
:root{--acc-dim:color-mix(in oklch,var(--acc) 15%,transparent);--acc-soft:color-mix(in oklch,var(--acc) 12%,transparent);--acc-line:color-mix(in oklch,var(--acc) 38%,transparent)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg0);color:var(--text0);font:14px/1.6 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* 背景光晕：玻璃需要有东西可"磨" */
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(90px);opacity:.55}
body::before{width:62vw;height:62vw;left:-18vw;top:-30vw;background:radial-gradient(circle,color-mix(in oklch,var(--acc) 55%,transparent),transparent 65%)}
body::after{width:55vw;height:55vw;right:-20vw;bottom:-28vw;background:radial-gradient(circle,color-mix(in oklch,var(--blob2) 60%,transparent),transparent 65%)}
button{font-family:inherit;color:inherit}
::selection{background:var(--acc-dim)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--hl)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:oklch(19% 0.01 265 / .96);--glass2:oklch(23% 0.012 265 / .97)}
}

/* ================= 布局 ================= */
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-columns:236px minmax(0,1fr) 330px;grid-template-areas:"side main today";gap:10px;padding:10px}
#side{grid-area:side;display:flex}
#chatView,#panelView{grid-area:main}
#today{grid-area:today;display:flex}
#app:not(.v-panel) #panelView{display:none}
#app.v-panel #chatView{display:none}
#mnav,#pchips{display:none}
@media (max-width:1180px){
  #app{grid-template-columns:220px minmax(0,1fr);grid-template-areas:"side main"}
  #today{display:none}
  #app.v-today #today{display:flex;grid-area:main}
  #app.v-today #chatView,#app.v-today #panelView{display:none}
}
@media (min-width:1181px){ .nav[data-view="today"]{display:none} }
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"main" "nav";gap:0;padding:0}
  #side{display:none}
  #mnav{display:flex;grid-area:nav}
  #pchips{display:flex}
}

/* ================= 侧栏 ================= */
#side{flex-direction:column;gap:12px;padding:12px 10px;border-radius:var(--r2);min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--acc-ink);background:linear-gradient(150deg,var(--acc2),var(--acc));box-shadow:inset 0 0 0 1px oklch(100% 0 0 / .18),0 4px 14px color-mix(in oklch,var(--acc) 35%,transparent);flex-shrink:0}
.brand b{font-size:15px;font-weight:650;letter-spacing:.3px}
.conn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.conn .dot{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.conn.on .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in oklch,var(--ok) 20%,transparent)}
.conn.off{color:var(--err)} .conn.off .dot{background:var(--err)}
#cmdBtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--text2);font-size:13px;cursor:pointer;width:100%;text-align:left}
#cmdBtn:hover{border-color:var(--line2);color:var(--text1)}
.kbd{margin-left:auto;font:11px var(--mono);color:var(--text3);border:1px solid var(--line2);border-radius:5px;padding:0 5px;line-height:18px}
.navgrp{display:flex;flex-direction:column;gap:1px}
.navgrp h6{font-size:11.5px;font-weight:500;color:var(--text3);padding:8px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--text1);font-size:13.5px;cursor:pointer;border:1px solid transparent;background:none;width:100%;text-align:left;transition:background .12s,color .12s}
.nav:hover{background:var(--bg2);color:var(--text0)}
.nav.on{background:var(--glass2);color:var(--text0);border-color:var(--line);box-shadow:var(--hl)}
.nav.on svg.i{color:var(--acc)}
.nav .c{margin-left:auto;font-size:11.5px;color:var(--text3)}
.nav .c:empty,.nav .c[data-zero]{display:none}
.nav .unread{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:auto;display:none}
.nav .unread.show{display:block}
#sideSessions{list-style:none;display:flex;flex-direction:column;gap:1px;margin:2px 0 4px}
#sideSessions li{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 36px;border-radius:7px;font-size:13px;color:var(--text2);cursor:pointer}
#sideSessions li:hover{background:var(--bg2);color:var(--text1)}
#sideSessions li.on{color:var(--text0);background:var(--bg2)}
#sideSessions li .st{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sideSessions li .xdel{opacity:0;border:none;background:none;cursor:pointer;color:var(--text3);font-size:12px;padding:2px 4px}
#sideSessions li:hover .xdel{opacity:1}
#sideSessions li .xdel:hover{color:var(--err)}
#sideSessions .more{padding-left:36px;font-size:12px;color:var(--text3)}
.sidefoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 2px;border-top:1px solid var(--line)}
.ava{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:linear-gradient(150deg,color-mix(in oklch,var(--blob2) 70%,white 10%),var(--blob2));color:white;flex-shrink:0}
.sidefoot .who{min-width:0;flex:1}
.sidefoot .who b{display:block;font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidefoot .who span{font-size:11.5px;color:var(--text3);cursor:pointer}
.sidefoot .who span:hover{color:var(--acc)}

/* ================= 主区（对话 / 面板） ================= */
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;border-radius:var(--r2);overflow:hidden}
.panehead{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.panehead h1{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.panehead .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 10px;border-radius:99px;border:1px solid var(--line2);font-size:12px;color:var(--text1);white-space:nowrap;flex-shrink:0}
.pill .lv{color:var(--acc);font-weight:650}
.pill.acc{color:var(--acc);border-color:var(--acc-line);background:var(--acc-soft)}
.iconbtn{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--text2);border:1px solid transparent;background:none;cursor:pointer;flex-shrink:0;font-size:13px}
.iconbtn:hover{background:var(--bg2);color:var(--text0)}
.iconbtn.del{width:24px;height:24px;font-size:14px}

#stream{flex:1;overflow-y:auto;min-height:0;padding:26px 24px 12px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
#stream>*{width:100%;max-width:780px;margin-left:auto;margin-right:auto;flex-shrink:0}
.msg{animation:rise .22s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .body{max-width:80%;padding:9px 15px;border-radius:16px 16px 5px 16px;background:color-mix(in oklch,var(--acc) 22%,oklch(24% 0.012 265 / .7));border:1px solid var(--acc-line);font-size:14.5px;white-space:pre-wrap;word-break:break-word;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.msg.assistant{display:flex;gap:12px}
.msg.assistant .mark{width:26px;height:26px;border-radius:8px;font-size:12.5px;margin-top:1px}
.msg.assistant .col{flex:1;min-width:0}
.msg.assistant .body{font-size:14.5px;line-height:1.75;word-break:break-word}
.msg .mode{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text3);margin-bottom:4px}
.msg.sys{text-align:center;font-size:12px;color:var(--text3)}
.msg.sys.err,.msg.err .body{color:var(--err)}
.caret{display:inline-block;width:7px;height:1.05em;vertical-align:-2px;background:var(--acc);margin-left:2px;border-radius:1px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
/* markdown */
.body p{margin:0 0 .6em} .body p:last-child{margin-bottom:0}
.body h1,.body h2,.body h3{font-size:15px;font-weight:650;margin:.8em 0 .35em}
.body ul,.body ol{padding-left:1.4em;margin:.3em 0 .6em}
.body li{margin:.15em 0}
.body code{font:12.5px var(--mono);background:var(--bg3);padding:1px 6px;border-radius:5px}
.body pre{font:12.5px/1.65 var(--mono);background:oklch(10% 0.008 265 / .7);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:.5em 0}
.body pre code{background:none;padding:0}
.body a{color:var(--acc2)}
.body blockquote{border-left:2px solid var(--acc-line);padding-left:10px;color:var(--text1)}
.body strong,.body b{font-weight:650}
.body table{border-collapse:collapse;font-size:13px;margin:.5em 0}
.body th,.body td{border:1px solid var(--line2);padding:4px 9px}

/* 结构化工具卡（B 式："记了什么"而不是日志） */
.tgroup{border-radius:12px;overflow:hidden;animation:rise .22s cubic-bezier(.2,.7,.3,1)}
.trow{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;transition:background .12s}
.trow:hover{background:var(--bg2)}
.trow+.trow,.tdetail+.trow{border-top:1px solid var(--line)}
.trow .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:var(--bg3);color:var(--text1)}
.trow .ic svg.i{width:16px;height:16px}
.trow .ic.warm{background:color-mix(in oklch,oklch(80% 0.12 60) 16%,transparent);color:oklch(82% 0.12 60)}
.trow .ic.cool{background:color-mix(in oklch,var(--cool) 16%,transparent);color:var(--cool)}
.trow .ic.ok{background:color-mix(in oklch,var(--ok) 16%,transparent);color:var(--ok)}
.trow .ic.acc{background:var(--acc-soft);color:var(--acc)}
.trow .tx{flex:1;min-width:0}
.trow .tx b{display:block;font-size:13.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tx span{display:block;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .val{font-size:13px;font-weight:600;color:var(--text1);flex-shrink:0}
.trow .stt{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex-shrink:0}
.trow .stt.ok{color:var(--ok);background:color-mix(in oklch,var(--ok) 15%,transparent)}
.trow .stt.err{color:var(--err);background:color-mix(in oklch,var(--err) 15%,transparent)}
.trow .stt.run{border:1.6px solid var(--acc);border-top-color:transparent;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.tdetail{display:none;padding:4px 14px 12px 56px;font-size:12px;color:var(--text2)}
.tdetail.open{display:block}
.tdetail .k{font-size:11.5px;color:var(--text3);margin:8px 0 3px}
.tdetail .v{font:12px/1.6 var(--mono);color:var(--text1);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;background:oklch(10% 0.008 265 / .55);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tdetail .v.err{color:var(--err)}
.risk{font:11px var(--mono);padding:0 6px;border-radius:5px;border:1px solid var(--line2);color:var(--text2)}
.risk.r2{color:var(--cool);border-color:color-mix(in oklch,var(--cool) 35%,transparent)}
.risk.r3{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 35%,transparent)}
.risk.r4{color:var(--err);border-color:color-mix(in oklch,var(--err) 40%,transparent)}

/* 行内确认卡 */
.approve{border-radius:14px;border:1px solid var(--acc-line);background:linear-gradient(180deg,var(--acc-soft),transparent 70%),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);padding:14px 16px;box-shadow:var(--hl),0 10px 30px oklch(0% 0 0 / .25);animation:rise .22s cubic-bezier(.2,.7,.3,1)}
.approve .h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--acc);font-weight:550}
.approve .h .risk{margin-left:auto}
.approve .q{font-size:14.5px;margin:8px 0 10px;word-break:break-word}
.approve .q code{font:13px var(--mono);background:var(--bg3);padding:1px 6px;border-radius:5px}
.approve .cmd{font:12.5px/1.65 var(--mono);background:oklch(9% 0.008 265 / .7);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text1);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
.approve .note{font-size:12px;color:var(--warn);margin-top:9px}
.approve .btns{display:flex;align-items:center;gap:8px;margin-top:12px}
.approve .tm{font-size:12px;color:var(--text3)}
.approve .btns .sp{flex:1}

/* 输入区 */
#composer{padding:8px 20px 16px;flex-shrink:0}
.cbox{max-width:780px;margin:0 auto;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:flex-end;gap:8px;background:var(--glass2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);box-shadow:var(--hl),var(--shadow);transition:border-color .15s}
.cbox:focus-within{border-color:var(--acc-line)}
#input{flex:1;resize:none;background:none;border:none;outline:none;color:var(--text0);font:14.5px/1.6 var(--sans);padding:5px 0;max-height:180px}
#input::placeholder{color:var(--text3)}
#sendBtn{width:34px;height:34px;border-radius:10px;border:none;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:filter .15s,transform .1s}
#sendBtn:hover{filter:brightness(1.08)}
#sendBtn:active{transform:scale(.96)}
#sendBtn:disabled{opacity:.35;cursor:default}
#sendBtn svg.i{stroke-width:2.3}
#thinking{display:none;align-items:center;gap:8px;max-width:780px;margin:0 auto 8px;font-size:12.5px;color:var(--text2)}
#thinking.show{display:flex}
.spin{width:13px;height:13px;border:1.6px solid var(--line3);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
#suggest{display:flex;gap:6px;flex-wrap:wrap;max-width:780px;margin:0 auto 8px}
#suggest button{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line2);background:var(--bg2);font-size:12.5px;color:var(--text1);cursor:pointer}
#suggest button:hover{border-color:var(--acc-line);color:var(--text0)}

/* 会话弹层（窄屏） */
#sessionBar{display:none;position:absolute;right:12px;top:48px;z-index:20;width:min(320px,calc(100% - 24px));max-height:60%;overflow:auto;border-radius:12px;padding:6px;background:var(--glass-solid);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);box-shadow:var(--shadow)}
#sessionBar.show{display:block}
#sessionBar .sessHead{display:flex;align-items:center;padding:6px 8px;font-size:12.5px;color:var(--text2)}
#sessionBar .sessHead b{flex:1;font-weight:550}
#sessionList{list-style:none}
#sessionList li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}
#sessionList li:hover{background:var(--bg2)}
#sessionList li.on{background:var(--acc-soft);color:var(--text0)}
#sessionList li .st{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sessionList li .sc{font-size:11.5px;color:var(--text3)}
#sessionList li .xdel{border:none;background:none;color:var(--text3);cursor:pointer;padding:2px 4px}
#sessionList li .xdel:hover{color:var(--err)}
#chatView{position:relative}

/* ================= 面板区 ================= */
#pchips{gap:6px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
#pchips::-webkit-scrollbar{display:none}
#pchips button{height:30px;padding:0 13px;border-radius:99px;border:1px solid var(--line2);background:var(--bg2);font-size:13px;color:var(--text1);white-space:nowrap;cursor:pointer}
#pchips button.on{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:600}
#panelBody{flex:1;overflow-y:auto;min-height:0;padding:18px 20px 28px}
#panelBody>*{max-width:900px}
.panel-hd{display:none}
.pcard{border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--hl)}
.pcard h4{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pcard h4 .tag{font-size:11.5px;color:var(--text3);font-weight:400}

<script>
'use strict';
/* ================================================================
   LAN 访问令牌（可选）：server 侧 paa/data/lan.json 配置 accessToken 后，
   所有 /api 请求自动带 x-access-token 头；403 时提示输入并重载。
   ================================================================ */
const PAA_TOKEN = (() => { try { return localStorage.getItem('paaToken') || ''; } catch { return ''; } })();
{
  const _fetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const u = typeof input === 'string' ? input : (input && input.url) || '';
    if (PAA_TOKEN && u.includes('/api/')) {
      init = init || {};
      const h = new Headers(init.headers || {});
      if (!h.has('x-access-token')) h.set('x-access-token', PAA_TOKEN);
      init.headers = h;
    }
    const res = await _fetch(input, init);
    if (res.status === 403 && u.includes('/api/') && !u.includes('/api/auth/')) {
      const t = prompt('PAA 服务器需要访问令牌（paa/data/lan.json 的 accessToken）：');
      if (t) { try { localStorage.setItem('paaToken', t); } catch { /* 忽略 */ } location.reload(); }
    }
    return res;
  };
}
/* ================================================================
   枢 · PAA Console v1 — 状态驱动控制台
   数据主权在 Node 侧 JSON 文件；本页不落 localStorage（仅迁移按钮只读旧值）
   ================================================================ */

/* ---------- utils ---------- */
const $ = (s) => document.querySelector(s);
const fmtTime = (d) => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const parseD = (s) => { if(!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const fmtD = (d) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const WDAY = ['日','一','二','三','四','五','六'];

/* ---------- state（唯一数据源） ---------- */
const S = {
  ws:null, connected:false, level:2, tools:[], pkgs:[], sessionId:null,
  data:null, msgs:[], busy:false, confirm:null, confirmTimer:null, confirmLeft:60,
  tab:'schedule', runSeq:0, toastTimer:null, seenEvents:new Set(), toolRisk:{},
  chatW:55, collapse:null, full:null,   // 布局：chat 宽%、收起/全屏区
  view:{},                                // 各面板视图状态 { tab: {mode, date, sel, ...} }
};
function vw(tab, def){ return S.view[tab] || (S.view[tab] = Object.assign({mode:'month', date:new Date()}, def)); }

/* ---------- 轻量渲染：区块级 ---------- */
function renderHeader(){
  $('#wsBadge').className = 'conn ' + (S.connected ? 'on' : 'off');
  $('#wsTxt').textContent = S.connected ? '在线' : (S.ws && S.ws.readyState===0 ? '连接中' : '离线');
  $('#lvBadge').innerHTML = 'L<span class="lv">' + S.level + '</span>';
  $('#toolBadge').innerHTML = '工具 <span class="lv">' + (S.tools.length||'-') + '</span>';
  $('#sessTxt').textContent = S.sessionTitle || '新对话';
  $('#runPill').style.display = S.busy ? '' : 'none';
  $('#demoPill').style.display = S.demo ? '' : 'none';
}
function tickClock(){
  const el = $('#tClock');
  if (el) el.textContent = fmtTime(new Date()).slice(0, 5);
}

/* ---------- S1 登录态：/api/auth/me → 徽标（点击登出/去登录） ---------- */
/* 兜底通道：OAuth 回跳带 ?st=<sid>（Set-Cookie 可能被 SW/浏览器拦截）→ JS 直接写 cookie（30 天） */
function adoptSessionToken(){
  try {
    const st = new URLSearchParams(location.search).get('st');
    if (!st || !/^[0-9a-f]{32}$/.test(st)) return;
    document.cookie = 'paa_session=' + st + '; Path=/; SameSite=Lax; Max-Age=' + (30 * 24 * 3600);
    history.replaceState(null, '', location.pathname); // 清掉 URL 里的 st，避免留在历史记录
  } catch { /* 忽略 */ }
}

async function checkAuth(){
  const el = $('#authBadge');
  const setLocal = () => {
    S.user = null;
    $('#userName').textContent = '本地模式';
    $('#avaTxt').textContent = '枢';
    el.textContent = '登录以同步';
    el.title = 'GitHub 登录（云端同步）';
    el.onclick = () => { location.href = '/api/auth/login'; };
  };
  try {
    const res = await fetch('/api/auth/me?ts=' + Date.now(), { headers: { 'Accept': 'application/json' } });
    if (!res.ok) return setLocal();
    const d = await res.json();
    const u = d.user || {};
    S.user = u;
    $('#userName').textContent = u.name || u.id || '已登录';
    $('#avaTxt').textContent = String(u.name || u.id || '枢').slice(0, 1);
    el.textContent = '已同步 · 登出';
    el.title = (u.email || '') + ' · 第 ' + (d.logins || 1) + ' 次登录';
    el.onclick = async () => {
      if (!confirm('登出当前账号（' + (u.name || u.id) + '）？')) return;
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch { /* 忽略 */ }
      location.reload();
    };
    renderToday();
  } catch { setLocal(); }
}

/* ---------- 消息流（工具卡 + 日志行） ---------- */
function renderStream(){
  const box = $('#stream'); box.textContent = '';
  let grp = null;
  S.msgs.forEach((m, i) => {
    if (m.kind === 'tool'){
      // 连续的工具调用合成一张卡（B 式"记了什么"）
      if (!grp){ grp = document.createElement('div'); grp.className = 'tgroup glass'; box.appendChild(grp); }
      buildToolCard(m, grp);
    } else {
      grp = null;
      const el = buildMsg(m); el.dataset.i = i; box.appendChild(el);
    }
  });
  if (S.confirm) box.appendChild(buildConfirm());
  $('#clearBtn').style.display = S.msgs.length ? '' : 'none';
  renderSuggest();
}
/* ---------- v1.2 打字机泵：网络 delta 成批涌到 → 按帧平滑逐字放出 ----------
   自适应步长：积压 ≤8 字符时逐字；积压越多每帧吐得越多（ceil(remain/8)），
   最多 8 帧（~130ms）追平网络，视觉上始终平滑且永不落后。 */
function twKick(){ if (!S._twOn){ S._twOn = true; requestAnimationFrame(twPump); } }
function twPump(){
  let anim = false;
  const box = $('#stream');
  for (let i = 0; i < S.msgs.length; i++){
    const m = S.msgs[i];
    if (m.kind !== 'assistant' || !m.streaming) continue;
    if (m.shown === undefined) m.shown = m.text.length;
    if (m.shown > m.text.length) m.shown = m.text.length;
    if (m.shown < m.text.length){
      anim = true;
      m.shown += Math.max(1, Math.ceil((m.text.length - m.shown) / 8));
      const node = box.querySelector('[data-i="' + i + '"]');
      const body = node && node.querySelector('.body');
      if (body){ body.textContent = m.text.slice(0, m.shown); body.appendChild(caretEl()); }
    }
  }
  if (anim){ autoScroll(); requestAnimationFrame(twPump); }
  else S._twOn = false;
}
function pushMsg(m){
  S.msgs.push(m); renderStream(); autoScroll();
  // 不在对话视图时来了回复 → 导航上亮个点
  if ((m.kind === 'assistant' || m.kind === 'tool') && !chatVisible()){
    $('#mnavUnread').classList.add('show'); $('#sideUnread').classList.add('show');
  }
}
function caretEl(){ const c = document.createElement('span'); c.className = 'caret'; return c; }
function chatVisible(){ return $('#chatView').offsetParent !== null; }
/* ---------- 视图：today / chat / panel（S.tab） ---------- */
const TAB_NAME = { schedule:'日程', todos:'待办', finance:'记账', fitness:'健身', wellness:'养生', goals:'目标', memory:'记忆', tasks:'任务树', settings:'设置' };
const LIFE_TABS = ['schedule','todos','finance','fitness','wellness','goals'];
function setView(v, tab){
  if (v === 'life'){ v = 'panel'; tab = tab || (LIFE_TABS.includes(S.tab) ? S.tab : 'schedule'); }
  if (tab){ v = 'panel'; S.tab = tab; }
  S.v = v;
  const app = $('#app');
  app.classList.toggle('v-panel', v === 'panel');
  app.classList.toggle('v-today', v === 'today');
  document.querySelectorAll('#side .nav').forEach(n => n.classList.toggle('on',
    v === 'panel' ? n.dataset.tab === S.tab : n.dataset.view === v));
  document.querySelectorAll('#mnav button').forEach(b => b.classList.toggle('on',
    v === 'panel' ? (S.tab === 'settings' ? b.dataset.tab === 'settings' : b.dataset.view === 'life') : b.dataset.view === v));
  $('#sessionBar').classList.remove('show');
  if (v === 'panel') renderPanel();
  if (v === 'today') renderToday();
  if (chatVisible()){ $('#mnavUnread').classList.remove('show'); $('#sideUnread').classList.remove('show'); autoScroll(); }
  updateBanner();
}
function autoScroll(){
  const box = $('#stream');
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}
function buildMsg(m){
  const el = document.createElement('div');
  el.className = 'msg ' + (m.kind || 'sys') + (m.err ? ' err' : '');
  const body = document.createElement('div'); body.className = 'body';
  if (m.kind === 'assistant'){
    const mk = document.createElement('div'); mk.className = 'mark'; mk.textContent = '枢';
    const col = document.createElement('div'); col.className = 'col';
    if (m.mode && m.mode !== 'text'){
      const md = document.createElement('div'); md.className = 'mode';
      md.textContent = m.mode === 'plan-execute' ? '◇ 先计划再执行' : m.mode === 'single' ? '◇ 单步执行' : '◇ 顺序执行';
      col.appendChild(md);
    }
    if (m.streaming){ body.textContent = m.text.slice(0, m.shown ?? m.text.length); body.appendChild(caretEl()); }
    else body.appendChild(mdToDom(m.text || ''));
    col.appendChild(body);
    el.appendChild(mk); el.appendChild(col);
  } else {
    body.textContent = m.text || '';
    el.appendChild(body);
  }
  return el;
}
/* 工具调用 → 人话卡片：life_* 显示"记了什么"，其余显示动作 + 对象 */
const MEAL_LABEL = { breakfast:'早餐', lunch:'午餐', dinner:'晚餐', snack:'加餐' };
function toolView(name, a){
  a = (a && typeof a === 'object') ? a : {};
  const on = (d) => d && d !== todayStr() ? ' · ' + String(d).slice(5) : '';
  const firstStr = () => { for (const v of Object.values(a)) if (typeof v === 'string' && v) return v; return ''; };
  const n = String(name || '').replace(/^life_/, '');
  const v = lifeView(n, a, on);
  if (v){ v.life = true; return v; }
  return actionView(name, a, firstStr);
}

/* ---------- 简化 markdown → DOM（安全，不 innerHTML 拼接 LLM 内容） ---------- */
function mdToDom(src){
  const frag = document.createDocumentFragment();
  const lines = String(src).replace(/\r\n/g,'\n').split('\n');
  let i = 0, inCode = false, codeBuf = [], para = [];
  const flushPara = () => {
    if (!para.length) return;
    const p = document.createElement('p');
    p.appendChild(inlineMd(para.join('\n')));
    frag.appendChild(p); para = [];
  };
  while (i < lines.length){
    const ln = lines[i];
    if (/^```/.test(ln.trim())){
      if (inCode){
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = codeBuf.join('\n'); pre.appendChild(code);
        frag.appendChild(pre); codeBuf = []; inCode = false;
      } else { flushPara(); inCode = true; }
      i++; continue;
    }
    if (inCode){ codeBuf.push(ln); i++; continue; }
    const t = ln.trim();
    if (/^###\s/.test(t)){ flushPara(); const h=document.createElement('h3'); h.appendChild(inlineMd(t.replace(/^###\s+/,''))); frag.appendChild(h); }
    else if (/^##\s/.test(t)){ flushPara(); const h=document.createElement('h2'); h.appendChild(inlineMd(t.replace(/^##\s+/,''))); frag.appendChild(h); }
    else if (/^#\s/.test(t)){ flushPara(); const h=document.createElement('h1'); h.appendChild(inlineMd(t.replace(/^#\s+/,''))); frag.appendChild(h); }
    else if (/^[-*]\s/.test(t)){
      flushPara();
      let ul = null;
      for (const ch of frag.children) if (ch.tagName==='UL') ul = ch;
      const li = document.createElement('li'); li.appendChild(inlineMd(t.replace(/^[-*]\s+/,'')));
      if (ul) ul.appendChild(li); else { const u=document.createElement('ul'); u.appendChild(li); frag.appendChild(u); }
    }
    else if (/^\d+\.\s/.test(t)){
      flushPara();
      let ol = null;
      for (const ch of frag.children) if (ch.tagName==='OL') ol = ch;
      const li = document.createElement('li'); li.appendChild(inlineMd(t.replace(/^\d+\.\s+/,'')));
      if (ol) ol.appendChild(li); else { const o=document.createElement('ol'); o.appendChild(li); frag.appendChild(o); }
    }
    else if (/^\|.*\|$/.test(t)){
      flushPara();
      const cells = t.split('|').slice(1,-1).map(x=>x.trim());
      if (/^:?-{2,}:?$/.test(cells[0]||'')){ i++; continue; }
      let table = null;
      for (const ch of frag.children) if (ch.tagName==='TABLE' && !ch.dataset.closed) table = ch;
      if (!table){ table=document.createElement('table'); frag.appendChild(table); }
      const tr=document.createElement('tr');
      for (const c of cells){ const cell=document.createElement(tr.childElementCount? 'td':'th'); cell.appendChild(inlineMd(c)); tr.appendChild(cell); }
      table.appendChild(tr);
    }
    else if (!t){ flushPara(); }
    else { para.push(ln); }
    i++;
  }
  if (inCode){ const pre=document.createElement('pre'); const code=document.createElement('code'); code.textContent=codeBuf.join('\n'); pre.appendChild(code); frag.appendChild(pre); }
  flushPara();
  return frag;
}
function inlineMd(src){
  const frag = document.createDocumentFragment();
  const re = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*)/g;
  let last = 0, m;
  while ((m = re.exec(src))){
    if (m.index > last) frag.appendChild(document.createTextNode(src.slice(last, m.index)));
    const tok = m[0];
    if (tok.startsWith('`')){ const c=document.createElement('code'); c.textContent=tok.slice(1,-1); frag.appendChild(c); }
    else if (tok.startsWith('**')){ const b=document.createElement('strong'); b.appendChild(inlineMd(tok.slice(2,-2))); frag.appendChild(b); }
    else { const e=document.createElement('em'); e.appendChild(inlineMd(tok.slice(1,-1))); frag.appendChild(e); }
    last = m.index + tok.length;
  }
  if (last < src.length) frag.appendChild(document.createTextNode(src.slice(last)));
  return frag;
}

/* ---------- WS ---------- */
function connect(){
  clearTimeout(S._reconn);
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto + '://' + location.host + '/ws' + (PAA_TOKEN ? '?token=' + encodeURIComponent(PAA_TOKEN) : ''));
  S.ws = ws; renderHeader();
  ws.onopen = () => { S.connected = true; renderHeader(); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    handleWs(m);
  };
  ws.onclose = () => {
    const was = S.connected;
    S.connected = false; renderHeader();
    if (was) toast('连接断开，正在重连…');
    S._reconn = setTimeout(connect, 3000);
  };
  ws.onerror = () => { S.connected = false; renderHeader(); };
}
function pushSys(text){ pushMsg({kind:'sys', text, ts:Date.now()}); }

function handleWs(m){
  switch (m.type){
    case 'welcome':
      // welcome.sessionId 是 server 的 run id，不是对话会话 id——不能覆盖 S.sessionId（否则重连后消息发进错的会话）
      S.tools = m.tools || S.tools; S.pkgs = m.pkgs || S.pkgs;
      S.toolRisk = m.risks || S.toolRisk;
      S.demo = !!m.demo;
      S.level = (m.level !== undefined) ? m.level : S.level;
      renderHeader(); break;
    case 'level': S.level = m.level; renderHeader(); break;
    case 'event':
      // server 推的是 {type:'event', ev}；本端 run 进行中时 SSE 已送达同一批事件
      if (!S.busy) handleEvent(m.ev || m.event);
      break;
    case 'confirm': {
      S.confirm = { id: m.id, tool: m.tool, prompt: m.prompt, args: m.args };
      S.confirmLeft = 60;
      clearInterval(S.confirmTimer);
      S.confirmTimer = setInterval(() => {
        S.confirmLeft--;
        const c = $('#confLeft');
        if (c) c.textContent = S.confirmLeft + ' 秒后自动拒绝';
        if (S.confirmLeft <= 0){ clearInterval(S.confirmTimer); S.confirm=null; renderConfirm(); }
      }, 1000);
      renderConfirm(); break;
    }
    case 'confirm_timeout':
      if (S.confirm && S.confirm.id === m.id){ S.confirm = null; clearInterval(S.confirmTimer); renderConfirm(); toast('操作超时，已拒绝'); }
      break;
    case 'confirm_done':
      // 另一端（手机/另一个标签页）已应答：关掉本端的同一张卡
      if (S.confirm && S.confirm.id === m.id){ S.confirm = null; clearInterval(S.confirmTimer); renderConfirm(); }
      break;
    case 'trusted':
      if (S.confirm && S.confirm.id === m.id){ S.confirm = null; clearInterval(S.confirmTimer); renderConfirm(); }
      toast('本次会话「' + toolView(m.tool, {}).title + '」不再询问'); break;
    case 'change':
      fetchData(m.key); break;
    case 'heal':
      toast('数据文件损坏，已自动重建'); fetchData(); break;
    case 'audit':
      console.debug('[audit]', m.line); break;
  }
}
/* 同一事件可能经 SSE 与 WS 各到一次（server 两路都推）：按事件身份去重 */
function eventKey(ev){
  const p = ev.payload || {};
  return ev.ts + '|' + ev.type + '|' + (p.name || '') + '|' + String(p.text || p.content || '').length;
}
function handleEvent(ev, sseCard){
  if (!ev || !ev.type) return;
  const key = eventKey(ev);
  if (S.seenEvents.has(key)) return;
  S.seenEvents.add(key);
  if (S.seenEvents.size > 500) S.seenEvents = new Set([...S.seenEvents].slice(-200));
  switch (ev.type){
    case 'user': {
      // 本端发起的 run：send() 已经渲染过这条用户消息
      if (sseCard) return;
      const lastU = [...S.msgs].reverse().find(mm => mm.kind==='user');
      if (lastU && lastU.text === ev.payload.text && Date.now() - lastU.ts < 60_000) return;
      pushMsg({kind:'user', text: ev.payload.text, ts: Date.now()});
      break;
    }
    case 'assistant': {
      const content = ev.payload.content || '';
      // 同 run 的 SSE 流式卡：只补 mode，不重复 push（delta 已实时渲染）
      if (sseCard){ if (ev.payload.mode && typeof sseCard === 'object' && !sseCard.mode) sseCard.mode = ev.payload.mode; return; }
      const sc = S.msgs.find(mm => mm.streaming);
      if (sc){ if (ev.payload.mode && !sc.mode) sc.mode = ev.payload.mode; return; }
      // WS 通道去重：与最近一条 assistant 文本相同 → 已由 SSE 渲染
      const lastA = [...S.msgs].reverse().find(mm => mm.kind==='assistant');
      if (lastA && lastA.text === content){ if (ev.payload.mode && !lastA.mode) lastA.mode = ev.payload.mode; return; }
      pushMsg({kind:'assistant', text: content, mode: ev.payload.mode, ts: Date.now()});
      break;
    }
    case 'tool': {
      // 本端流式 run：先把工具调用前的文字收尾成一张卡，之后的文字另起一张（保持时间顺序）
      if (sseCard) finishCard();
      // agent-loop 在工具执行完后才发 tool 事件，payload.result = {ok, data?, error?}
      const r = ev.payload.result;
      const card = {kind:'tool', toolName: ev.payload.name, risk: ev.payload.risk || S.toolRisk[ev.payload.name],
        args: ev.payload.arguments, state: r ? (r.ok ? 'ok' : 'err') : 'run', ts: Date.now()};
      if (r && r.ok) card.result = r.data;
      if (r && !r.ok) card.err = r.error || '失败';
      pushMsg(card);
      break;
    }
    case 'tool_result':
      for (let i = S.msgs.length-1; i >= 0; i--){
        const mm = S.msgs[i];
        if (mm.kind==='tool' && mm.toolName === ev.payload.name && mm.state==='run'){
          if (ev.payload.error){ mm.err = ev.payload.error; mm.state='err'; }
          else { mm.result = ev.payload.result; mm.state='ok'; }
          break;
        }
      }
      renderStream(); break;
  }
}

/* ---------- chat（SSE 流式，v1.1 打字机） ---------- */
function handleSse(evtRaw){
  if (!evtRaw.startsWith('data:')) return;
  // 当前流式卡：工具调用后置空，下一段文字到来时再新建（见 handleEvent 'tool'）
  let card = S.curCard;
  const ensureCard = () => {
    if (!card){ card = S.curCard = {kind:'assistant', text:'', mode:null, streaming:true, shown:0, ts:Date.now()}; S.msgs.push(card); renderStream(); renderComposer(); }
    return card;
  };
  let j; try { j = JSON.parse(evtRaw.slice(5).trim()); } catch { return; }
  switch (j.type){
    case 'meta':
      if (j.sessionId) S.sessionId = j.sessionId;
      break;
    case 'delta': {
      if (!j.text) break;
      ensureCard();
      card.text += j.text;
      // 检测并剥离首行 [MODE:xxx]（同步回调已展示的字符数）
      const m = /^\s*\[MODE:(plan-execute|single|sequential|text)\]\s*/.exec(card.text);
      if (m){ card.mode = m[1]; card.text = card.text.slice(m[0].length); card.shown = Math.max(0, (card.shown || 0) - m[0].length); }
      twKick();
      break;
    }
    case 'event':
      handleEvent(j.ev, card || true);
      break;
    case 'done': {
      finishCard();
      if (j.sessionId) S.sessionId = j.sessionId;
      if (j.rounds !== undefined || j.toolCalls !== undefined){
        const info = (j.rounds!==undefined ? j.rounds+' rounds' : '') + (j.toolCalls!==undefined ? ' · '+j.toolCalls+' tools' : '');
        if (info) pushSys('本轮：' + info);
      }
      renderStream(); autoScroll();
      break;
    }
    case 'error': {
      ensureCard(); card.streaming = false;
      card.text += '\n\n❌ ' + (j.error || '未知错误');
      renderStream(); autoScroll();
      break;
    }
  }
}
async function send(){
  const inp = $('#input');
  const text = inp.value.trim();
  if (!text || S.busy) return;
  inp.value = ''; autoGrow();
  S.busy = true; S.curCard = null; renderComposer(); renderHeader();
  ++S.runSeq;
  pushMsg({kind:'user', text, ts: Date.now()});
  try{
    const r = await fetch('/api/chat/stream', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, sessionId: S.sessionId }),
    });
    if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    for(;;){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let sep;
      while ((sep = buf.indexOf('\n\n')) >= 0){
        const evt = buf.slice(0, sep); buf = buf.slice(sep+2);
        handleSse(evt);
      }
    }
    if (buf.trim()) handleSse(buf);
  }catch(e){
    finishCard();
    pushMsg({kind:'sys', err:true, text:'请求失败：' + e.message, ts: Date.now()});
  }finally{
    finishCard();
    S.busy = false; renderComposer(); renderHeader(); loadSessions();
  }
}
/* 结束当前流式卡：转为 markdown 渲染；空卡（本轮只有工具调用）直接移除 */
function finishCard(){
  const c = S.curCard; if (!c) return;
  S.curCard = null;
  c.streaming = false;
  if (!c.text.trim()){ const i = S.msgs.indexOf(c); if (i >= 0) S.msgs.splice(i, 1); }
  renderStream(); autoScroll(); renderComposer();
}
function renderComposer(){
  $('#sendBtn').disabled = S.busy;
  // 文字已经在流出来时不再显示"思考中"
  $('#thinking').classList.toggle('show', S.busy && !S.curCard);
}
function autoGrow(){
  const inp = $('#input');
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 150) + 'px';
}

/* ---------- 数据 ---------- */
async function fetchData(key){
  try{
    const url = key ? '/api/data/' + encodeURIComponent(key) : '/api/data';
    const r = await fetch(url);
    if (!r.ok) return;
    const j = await r.json();
    if (key){ if (!S.data) S.data = {}; S.data[key] = j[key] ?? j.value ?? j; }
    else S.data = j;
    if (S.offline){ S.offline = false; toast('服务已恢复连接'); }
    renderPanel(); renderCounts();
  }catch(e){
    // 服务不可达：标记离线 + 5 秒静默重试（恢复后自动出数据，无需刷新）
    if (!S.offline){ S.offline = true; renderPanel(); }
    clearTimeout(S._retry);
    S._retry = setTimeout(() => fetchData(key), 5000);
  }
}

/* ---------- v2 · 数据写回（整键 PUT + 本地即时更新） ---------- */
async function putData(key, value){
  const r = await fetch('/api/data/' + key, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ value }),
  });
  if (!r.ok){ let m='HTTP '+r.status; try{ const j=await r.json(); m = j.error||m; }catch{} throw new Error(m); }
  if (!S.data) S.data = {};
  S.data[key] = value;
  renderPanel(); renderCounts();
  return true;
}
/* 数组追加/删除的便捷封装 */
function arrAdd(key, item){
  const arr = (S.data && S.data[key]) || [];
  return putData(key, arr.concat([item]));
}
function arrDel(key, idx){
  const arr = (S.data && S.data[key]) || [];
  if (idx<0 || idx>=arr.length) return Promise.resolve();
  return putData(key, arr.filter((_,i)=>i!==idx));
}
function arrSet(key, idx, item){
  const arr = (S.data && S.data[key]) || [];
  if (idx<0 || idx>=arr.length) return Promise.resolve();
  return putData(key, arr.map((x,i)=>i===idx?item:x));
}

let _modalCb = null;
function openModal(title, fields, onSubmit){
  const m = $('#modal'); const body = $('#modalBody');
  const t = $('#modalTitle'); t.textContent = title;
  body.textContent = '';
  for (const f of fields){
    const row = document.createElement('div'); row.className='frow';
    const lab = document.createElement('label'); lab.textContent = f.label;
    row.appendChild(lab);
    let el;
    if (f.type === 'days'){
      el = document.createElement('div'); el.style.cssText='display:flex;gap:5px';
      el.classList.add('daysbox'); el.dataset.key = f.key;
      const DN = ['一','二','三','四','五','六','日'];
      for (let i = 1; i <= 7; i++){
        const lb = document.createElement('label');
        lb.style.cssText='display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--text2);cursor:pointer;gap:2px;flex:1';
        const cb = document.createElement('input'); cb.type='checkbox'; cb.value = i;
        if (f.value && f.value.includes(i)) cb.checked = true;
        lb.appendChild(cb); lb.appendChild(document.createTextNode('周' + DN[i-1]));
        el.appendChild(lb);
      }
      row.appendChild(el); body.appendChild(row); continue;
    }
    else if (f.type === 'textarea'){

    if (el.tagName !== 'SELECT' && f.value !== undefined && el.type !== 'checkbox') el.value = f.value;

    el.dataset.key = f.key;

/* ---------- v2 · 月历通用渲染 ---------- */
/* marks: { 'YYYY-MM-DD': {dots:['a','c'], dv:'52.3', cls:'dv'} } */
function calMonth(y, m, marks, opts){
  opts = opts || {};
  const c = document.createElement('div'); c.className='cal';
  const top = document.createElement('div'); top.className='cal-top';
  const prev = document.createElement('button'); prev.className='iconbtn'; prev.textContent='‹';
  const title = document.createElement('span'); title.className='cal-title';
  title.textContent = y + ' 年 ' + (m+1) + ' 月';
  const next = document.createElement('button'); next.className='iconbtn'; next.textContent='›';
  top.appendChild(prev); top.appendChild(title); top.appendChild(next);
  c.appendChild(top);
  const grid = document.createElement('div'); grid.className='cal-grid';
  for (const w of ['日','一','二','三','四','五','六']){
    const cw = document.createElement('div'); cw.className='cw'; cw.textContent = w; grid.appendChild(cw);
  }
  const first = new Date(y, m, 1);
  const lead = first.getDay();
  const dim = new Date(y, m+1, 0).getDate();
  const prevDim = new Date(y, m, 0).getDate();
  const today = todayStr();
  const sel = opts.sel ? fmtD(opts.sel) : null;
  const mk = (yy, mm, dd, other) => {
    const d = document.createElement('div'); d.className='cd' + (other?' other':'');
    const ds = yy+'-'+String(mm+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    if (ds === today) d.classList.add('today');
    if (ds === sel) d.classList.add('sel');
    const num = document.createElement('div'); num.className='num'; num.textContent = dd;
    d.appendChild(num);
    const mk = marks && marks[ds];
    if (mk){
      if (mk.dots && mk.dots.length){
        const dots = document.createElement('div'); dots.className='dots';
        for (const cl of mk.dots){ const dot=document.createElement('i'); dot.className='dot '+cl; dots.appendChild(dot); }
        d.appendChild(dots);
      }
      if (mk.dv){
        const dv = document.createElement('div'); dv.className='dv' + (mk.cls?' '+mk.cls:'');
        dv.textContent = mk.dv; d.appendChild(dv);
      }
    }
    const key = fmtD(new Date(yy, mm, dd));
    d.addEventListener('click', () => opts.onDay && opts.onDay(key, yy, mm, dd));
    grid.appendChild(d);
  };
  for (let i = 0; i < lead; i++) mk(y, m-1, prevDim - lead + 1 + i, true);
  for (let i = 1; i <= dim; i++) mk(y, m, i, false);
  const trail = 7 - ((lead + dim) % 7 || 7);
  for (let i = 1; i <= trail; i++) mk(y, m+1, i, true);
  c.appendChild(grid);
  const foot = document.createElement('div'); foot.className='cal-foot';
  const l = document.createElement('span'); l.textContent = opts.footL || '';
  const r = document.createElement('span'); r.textContent = opts.footR || '';
  foot.appendChild(l); foot.appendChild(r);
  c.appendChild(foot);
  prev.addEventListener('click', () => opts.onNav && opts.onNav(-1));
  next.addEventListener('click', () => opts.onNav && opts.onNav(1));
  return c;
}

/* ---------- 面板：日程（7 天窗口 + rrule 展开） ---------- */
function expandInWindow(ev, start, end){
  const out = [];
  const d0 = parseD(ev.date); if (!d0) return out;
  const rrule = ev.rrule || 'none';
  if (rrule === 'none'){ if (d0 >= start && d0 <= end) out.push({...ev, _d: d0}); return out; }
  const until = ev.rruleUntil ? parseD(ev.rruleUntil) : null;
  const step = (cur) => {
    if (rrule==='weekly') cur.setDate(cur.getDate()+7);
    else if (rrule==='biweekly') cur.setDate(cur.getDate()+14);
    else if (rrule==='monthly') cur.setMonth(cur.getMonth()+1);
    else cur.setDate(cur.getDate()+1);
  };
  let cur = new Date(d0);
  let guard = 0;
  while (cur <= end && guard++ < 400){
    if (until && cur > until) break;
    if (cur >= start){
      let hit = true;
      if (rrule==='weekday'){ const wd = cur.getDay(); hit = wd>=1 && wd<=5; }
      else if (rrule==='weekly' && ev.rruleDays && ev.rruleDays.length){ const wd = cur.getDay()||7; hit = ev.rruleDays.includes(wd); }
      else if (rrule==='monthly'){ hit = cur.getDate() === d0.getDate(); }
      if (hit) out.push({...ev, _d: new Date(cur)});
    }
    step(cur);
  }
  return out;
}
const RRULE_LABEL = { none:'不重复', daily:'每天', weekly:'每周', biweekly:'每两周', monthly:'每月', weekday:'工作日' };
function evListOf(d, start, end){
  let evs = [];
  for (const ev of (d.schedule||[])) evs = evs.concat(expandInWindow(ev, start, end));
  evs.sort((a,b) => a._d - b._d || (a.startTime||'').localeCompare(b.startTime||''));
  return evs;
}
function evRow(ev, onDel){
  const r = document.createElement('div'); r.className='ev';

  dd.textContent = fmtD(ev._d).slice(5) + ' 周' + WDAY[ev._d.getDay()];

  t.textContent = (ev.startTime?ev.startTime+' ':'') + (ev.title||'');
  const s = document.createElement('div'); s.className='s';
  s.textContent = [ev.endTime&&('至 '+ev.endTime), ev.rrule&&ev.rrule!=='none'&&('重复:'+RRULE_LABEL[ev.rrule]||ev.rrule), ev.note].filter(Boolean).join(' · ');
  b.appendChild(t); b.appendChild(s);
  const cat = document.createElement('span'); cat.className='cat'; cat.textContent = ev.category||'life';
  const del = document.createElement('button'); del.className='iconbtn del'; del.textContent='×';
  del.style.cssText='margin-left:auto'; del.title='删除该事件';
  del.addEventListener('click', (e) => { e.stopPropagation(); onDel && onDel(); });
  r.appendChild(dd); r.appendChild(b); r.appendChild(cat); r.appendChild(del);
  return r;
}

/* ---------- 面板：目标 ---------- */
function streakDays(d, field){
  if (!field) return 0;
  const arr = d[field] || []; if (!arr.length) return 0;
  const set = new Set(arr.map(x=>x.date));
  let n = 0; const cur = new Date();
  while (true){
    const s = fmtD(cur);
    if (set.has(s)){ n++; cur.setDate(cur.getDate()-1); }
    else break;
  }
  return n;
}
function goalProgress(d, g){
  if (g.type === 'weight'){
    const start = g.startVal != null ? g.startVal : (d.weights&&d.weights.length ? d.weights[0].weight : null);
    const latest = d.weights&&d.weights.length ? d.weights[d.weights.length-1].weight : start;
    if (start == null || !(g.target>0)) return null;
    return { cur: latest, pct: Math.min(1.2, Math.max(0, (start-latest)/(start-g.target))) };
  }
  if (g.type === 'saving'){
    const cur = (d.investments||[]).reduce((s,i)=>s+(+i.amount||0),0);
    if (!(g.target>0)) return null;
    return { cur, pct: Math.min(1.2, cur/g.target) };
  }
  if (g.type === 'habit'){
    const n = streakDays(d, g.habitField);
    return { cur: n, pct: g.target>0 ? Math.min(1.2, n/g.target) : null };
  }
  return null;
}
const GOAL_TYPE = { weight:'减重', saving:'储蓄', habit:'习惯', custom:'自定义' };
function genMilestones(g){
  if (!g.endDate) return [];
  const start = g.startVal != null ? +g.startVal : 0;
  const target = +g.target || 0;
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const d1 = parseD(g.endDate);
  if (!d1 || target <= 0) return [];
  const total = Math.max(1, Math.round((d1 - d0) / (1000*3600*24)));
  const n = Math.min(4, Math.max(2, Math.round(total / 14)));
  const ms = [];
  for (let i = 1; i <= n; i++){
    const pct = i / n;
    const date = new Date(d0.getTime() + (d1 - d0) * pct);
    const cur = g.type==='weight' ? (start - (start - target) * pct) : (start + (target - start) * pct);
    ms.push({ title: g.type==='weight' ? ('达到 ' + cur.toFixed(1) + ' kg') : ('达到 ' + Math.round(cur) + (g.unit||'')), date: fmtD(date), done: false });
  }
  return ms;
}

function inPeriod(dateStr, mode, base){
  if (!dateStr) return false;
  if (mode==='day') return dateStr === fmtD(base);
  if (mode==='month') return dateStr.slice(0,7) === fmtD(base).slice(0,7);
  return dateStr.slice(0,4) === String(base.getFullYear());
}

/* ---------- 面板：任务树（G8 第三靶 · 中途失败自愈查证） ---------- */
function pTasks(d){
  const f = document.createDocumentFragment();
  const sid = S.sessionId;
  const c = card('Planner 任务树', 'runs/' + (sid ? sid.slice(0,8) : '--') + '/task-tree.json');
  if (!sid){
    c.appendChild(emptyBox('尚无活动会话。<br>先对枢发起一个长程目标，再回来看任务树'));
    f.appendChild(c); return f;
  }
  const body = document.createElement('div');
  body.innerHTML = '<div class="empty">⏳ 加载任务树…</div>';
  c.appendChild(body); f.appendChild(c);
  // 异步拉取任务树（含 t3 history 失败自愈快照）
  fetch('/api/tasks/' + encodeURIComponent(sid))
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(j => {
      body.textContent = '';
      // 目标 + 失败自愈摘要
      const hd = document.createElement('div');
      hd.innerHTML = '<div class="gt">🎯 ' + esc(j.goal || '未命名目标') + '</div>';
      body.appendChild(hd);
      const hs = j.healSummary || {};
      const mini = mini3([
        { lab:'任务节点', val: (j.tasks||[]).length },
        { lab:'exec-fail', val: hs.execFail||0, cls:'warn' },
        { lab:'replan 替换', val: hs.replanReplaced||0 },
        { lab:'replan 剪枝', val: hs.replanPruned||0 },
        { lab:'自愈记录', val: hs.entries||0 },
      ]);
      body.appendChild(mini);
      const tasks = j.tasks || [];
      if (!tasks.length){ body.appendChild(emptyBox('任务树为空（尚无任务被拆解）')); return; }
      const ul = document.createElement('div'); ul.style.cssText='margin-top:10px';
      for (const t of tasks){
        const d2 = document.createElement('div'); d2.className='prow';
        const st = t.status || '?';
        const stMap = { done:'✓ 完成', active:'▶ 进行', blocked:'⛔ 阻塞', pending:'○ 待办', failed:'✗ 失败' };
        const lc = document.createElement('span'); lc.className='l';
        lc.innerHTML = '<b>' + esc(stMap[st] || st) + '</b>&nbsp; ' + esc(t.desc || t.id || '（无描述）');
        const rc = document.createElement('span'); rc.className='r';
        const hh = t.history || [];
        rc.innerHTML = hh.length ? '<small title="' + esc(hh.map(h=>h.reason+'@'+h.status).join(' → ')) + '">自愈×' + hh.length + '</small>' : '';
        d2.appendChild(lc); d2.appendChild(rc); ul.appendChild(d2);
      }
      body.appendChild(ul);
      body.appendChild(emptyBox('注：exec-fail / replan 记录即「中途失败自愈」路径证据'));
    })
    .catch(err => {
      body.textContent = '';
      body.appendChild(emptyBox('⚠️ 任务树加载失败：' + esc(err.message) + '<br>该会话可能未运行过 Planner，或服务未连接'));
    });
  return f;
}

  for (const [k, n] of ACCENTS) add('操作', 'palette', '主题色：' + n, (document.documentElement.dataset.accent || 'brass') === k ? '当前' : '', () => setAccent(k));
  const ql = q.trim().toLowerCase();
  const hit = ql ? items.filter(it => (it.label + ' ' + it.hint).toLowerCase().includes(ql)) : items.filter(it => it.grp !== '会话' || (S.sessions || []).indexOf(it) < 5);
  if (ql) hit.push({ grp:'问枢', icon:'chat', label:'问枢：' + q.trim(), hint:'发送', run: () => { setView('chat'); $('#input').value = q.trim(); send(); } });
  return hit;
}
function openPalette(){
  S.pal = { q:'', sel:0, items:[] };
  $('#palette').classList.add('show');
  const inp = $('#palInput'); inp.value = ''; inp.focus();
  renderPalette();
}
function closePalette(){ $('#palette').classList.remove('show'); }
function renderPalette(){
  const P = S.pal; P.items = palItems(P.q);
  if (P.sel >= P.items.length) P.sel = Math.max(0, P.items.length - 1);
  const list = $('#palList'); list.textContent = '';
  let grp = '';
  P.items.forEach((it, i) => {
    if (it.grp !== grp){ grp = it.grp; const h = document.createElement('h6'); h.textContent = grp; list.appendChild(h); }
    const o = document.createElement('div'); o.className = 'opt' + (i === P.sel ? ' on' : '');
    o.innerHTML = '<svg class="i"><use href="#i-' + it.icon + '"/></svg><span></span><span class="hint"></span>';
    o.children[1].textContent = it.label; o.children[2].textContent = it.hint || '';
    o.addEventListener('mousemove', () => { if (P.sel !== i){ P.sel = i; renderPalette(); } });
    o.addEventListener('click', () => runPal(i));
    list.appendChild(o);
  });
  const on = list.querySelector('.opt.on'); if (on) on.scrollIntoView({ block:'nearest' });
}
function runPal(i){ const it = S.pal.items[i]; closePalette(); if (it) it.run(); }
function setAccent(k){
  if (k === 'brass') delete document.documentElement.dataset.accent; else document.documentElement.dataset.accent = k;
  try { localStorage.setItem('paaAccent', k === 'brass' ? '' : k); } catch { /* 忽略 */ }
  if (S.v === 'panel' && S.tab === 'settings') renderPanel();
  toast('主题色：' + (ACCENTS.find(a => a[0] === k) || [,''])[1]);
}

/* ---------- T1 多会话：会话栏 ---------- */
async function loadSessions(){
  try{
    const r = await fetch('/api/sessions');
    if (!r.ok) return;
    const j = await r.json();
    const list = j.sessions || [];
    // 首次加载：自动打开最近的会话（刷新页面不再是空白对话）
    if (!S._sessOpened){ S._sessOpened = true; if (!S.sessionId && list.length && !S.msgs.length){ await switchSession(list[0].id); return; } }
    renderSessionList(list);
  }catch(e){ /* 服务不可达静默 */ }
}
function renderSessionList(list){
  S.sessions = list;
  const cur = list.find(s => s.id === S.sessionId);
  S.sessionTitle = cur ? cur.title : (S.msgs.some(m => m.kind === 'user') ? S.sessionTitle : '');
  renderHeader();
  const li = (s, withCount) => '<li' + (s.id === S.sessionId ? ' class="on"' : '') + ' data-sid="' + esc(s.id) + '">' +
    '<span class="st">' + esc(s.title) + '</span>' + (withCount ? '<span class="sc">' + (s.messageCount || 0) + '</span>' : '') +
    '<button class="xdel" data-del="' + esc(s.id) + '" title="删除会话">✕</button></li>';
  const ul = $('#sessionList');
  ul.innerHTML = list.length ? list.map(s => li(s, true)).join('') : '<li style="cursor:default;color:var(--text3)">还没有会话</li>';
  const side = $('#sideSessions');
  side.innerHTML = list.slice(0, 6).map(s => li(s, false)).join('') + (list.length > 6 ? '<li class="more" data-more="1">全部 ' + list.length + ' 个会话…</li>' : '');
}
async function newSession(){
  try{
    const r = await fetch('/api/sessions', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    if (!r.ok) return;
    const j = await r.json();
    S.sessionId = j.session?.id || null;
    S.sessionTitle = '';
    S.msgs = []; renderStream(); renderHeader();
    setView('chat'); loadSessions();
    $('#input').focus();
  }catch(e){ toast('新建会话失败'); }
}
async function switchSession(id){
  try{
    const r = await fetch('/api/sessions/' + encodeURIComponent(id));
    if (!r.ok) return;
    const j = await r.json();
    S.sessionId = id;
    S.msgs = (j.session?.uiHistory || []).map((m) => Object.assign({}, m));
    S.sessionTitle = j.session?.title || '';
    renderStream(); autoScroll(); renderHeader();
    setView('chat'); loadSessions();
  }catch(e){ toast('切换会话失败'); }
}
async function deleteSession(id){
  try{
    const r = await fetch('/api/sessions/' + encodeURIComponent(id), { method:'DELETE' });
    if (!r.ok) return;
    if (S.sessionId === id){
      const j = await (await fetch('/api/sessions')).json();
      const first = (j.sessions || [])[0];
      if (first) await switchSession(first.id);
      else { S.sessionId = null; S.msgs = []; renderStream(); renderHeader(); }
    }
    loadSessions();
  }catch(e){ toast('删除会话失败'); }
}
function toggleSessionBar(){
  const bar = $('#sessionBar');
  bar.classList.toggle('show');
  if (bar.classList.contains('show')) loadSessions();
}
function onSessionClick(e){
  if (e.target.closest('[data-more]')){ toggleSessionBar(); return; }
  const del = e.target.closest('[data-del]');
  if (del){ e.stopPropagation(); if (confirm('删除这个会话？')) deleteSession(del.dataset.del); return; }
  const li = e.target.closest('li[data-sid]');
  if (li){ $('#sessionBar').classList.remove('show'); if (li.dataset.sid !== S.sessionId) switchSession(li.dataset.sid); else setView('chat'); }
}

/* ---------- init ---------- */
function init(){
  document.querySelectorAll('#side .nav, #mnav button').forEach(n => n.addEventListener('click', () => {
    if (n.dataset.tab) setView('panel', n.dataset.tab); else setView(n.dataset.view);
  }));
  const inp = $('#input');
  inp.addEventListener('input', autoGrow);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
  });
  $('#sendBtn').addEventListener('click', send);
  $('#sessBtn').addEventListener('click', toggleSessionBar);
  $('#sessNew').addEventListener('click', newSession);
  $('#sessionList').addEventListener('click', onSessionClick);
  $('#sideSessions').addEventListener('click', onSessionClick);
  $('#clearBtn').addEventListener('click', () => { S.msgs = []; renderStream(); });
  $('#modalOk').addEventListener('click', submitModal);
  $('#modalCancel').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
  $('#bannerGo').addEventListener('click', () => setView('chat'));
  // "今天"与建议：事件委托
  document.addEventListener('click', (e) => {
    const say = e.target.closest('[data-say]'); if (say){ sayDraft(say.dataset.say); return; }
    const go = e.target.closest('[data-go]'); if (go){ setView('panel', go.dataset.go); return; }
    const done = e.target.closest('[data-done]');
    if (done){
      const i = +done.dataset.done, it = ((S.data || {}).todos || [])[i];
      if (it) arrSet('todos', i, Object.assign({}, it, { done:true })).then(() => toast('已完成 · ' + it.title)).catch(err => toast('失败：' + err.message));
      return;
    }
    if (!e.target.closest('#sessionBar, #sessBtn')) $('#sessionBar').classList.remove('show');
  });
  // ⌘K
  $('#cmdBtn').addEventListener('click', openPalette);
  $('#palette').addEventListener('click', (e) => { if (e.target === e.currentTarget) closePalette(); });
  $('#palInput').addEventListener('input', (e) => { S.pal.q = e.target.value; S.pal.sel = 0; renderPalette(); });
  $('#palInput').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); S.pal.sel = Math.min(S.pal.items.length - 1, S.pal.sel + 1); renderPalette(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); S.pal.sel = Math.max(0, S.pal.sel - 1); renderPalette(); }
    else if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); runPal(S.pal.sel); }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#palette').classList.contains('show') ? closePalette() : openPalette(); }
    else if (e.key === 'Escape'){ closePalette(); $('#sessionBar').classList.remove('show'); }
  });
  window.addEventListener('resize', updateBanner);
  tickClock(); setInterval(tickClock, 1000);
  setInterval(() => { if (S.data) renderToday(); }, 60_000);  // 日程"下一项"随时间推移
  renderComposer(); renderHeader(); renderStream(); renderToday();
  setView('chat');
  fetchData();
  connect();
  loadSessions();
  adoptSessionToken();   // 兜底：登录回跳带 ?st= 时 JS 写 cookie（Set-Cookie 可能被 SW 吃掉）
  checkAuth();            // 登录态
}
init();
</script>
</body>
