name: check

on:
  push:
  pull_request:

jobs:
  paa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: paa/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
